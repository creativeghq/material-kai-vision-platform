# Gitleaks Configuration
# Prevents secrets from being committed to the repository

title = "Gitleaks Configuration for Material Kai Vision Platform"

# Global settings
[extend]
useDefault = true

# Custom rules for API keys
[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''(?i)(sk-[a-zA-Z0-9]{20,})'''
keywords = ["sk-"]
tags = ["api-key", "openai"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''(?i)(sk-ant-[a-zA-Z0-9\-]{90,})'''
keywords = ["sk-ant-"]
tags = ["api-key", "anthropic"]

[[rules]]
id = "supabase-service-role-key"
description = "Supabase Service Role Key"
regex = '''(?i)eyJ[a-zA-Z0-9_-]{100,}\.eyJ[a-zA-Z0-9_-]{100,}\.[a-zA-Z0-9_-]{40,}'''
keywords = ["service_role", "supabase"]
tags = ["jwt", "supabase"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:api[_-]?key|apikey|secret[_-]?key|access[_-]?key)['":\s]*=?\s*['"][a-zA-Z0-9\-_]{20,}['"]'''
keywords = ["api_key", "apikey", "secret_key", "access_key"]
tags = ["api-key"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'''
keywords = ["eyJ"]
tags = ["jwt"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (?:RSA|EC|OPENSSH|PGP) PRIVATE KEY-----'''
keywords = ["BEGIN PRIVATE KEY", "BEGIN RSA PRIVATE KEY"]
tags = ["private-key"]

# Allowlist - paths to ignore
[allowlist]
description = "Allowlisted files"
paths = [
    # Dependencies and build artifacts
    '''node_modules/''',
    '''.next/''',
    '''dist/''',
    '''build/''',
    
    # Package lock files (may contain hashes that look like keys)
    '''package-lock.json''',
    '''yarn.lock''',
    '''pnpm-lock.yaml''',
    
    # Documentation examples (use placeholder keys)
    '''docs/.*\.md''',
    '''README\.md''',
    '''\.github/SECURITY_FIXES\.md''',
    
    # Test files with mock keys
    '''__tests__/.*''',
    '''test/.*''',
    '''.*\.test\.ts''',
    '''.*\.spec\.ts''',
    
    # Git internals
    '''\.git/''',
]

# Allowlist specific regexes (for example keys in docs)
regexes = [
    # Example/placeholder keys in documentation
    '''sk-proj-xxxxxxxxxxxxxxxx''',
    '''sk-ant-xxxxxxxxxxxxxxxx''',
    '''your_openai_key''',
    '''your_api_key''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
    
    # Config schema definitions (not actual keys)
    '''z\.string\(\)\.optional\(\)''',
]

# Stopwords - these won't trigger if found alone
stopwords = [
    "example",
    "placeholder",
    "your",
    "test",
    "mock",
    "fake",
    "dummy",
]
