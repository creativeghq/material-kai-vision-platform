<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Google Search Console — domain/site ownership verification -->
    <meta name="google-site-verification" content="QCpe6GdtkRMAMUYcJ2jCazA9lAg0a_0XatX7nyU2jCs" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- PWA / installable web app — launch fullscreen (no browser chrome) when
         added to the home screen. theme-color matches the near-black shell so
         the status bar blends in; black-translucent lets content sit under the
         notch (paired with the safe-area-inset padding in the app shell). -->
    <meta name="theme-color" content="#0a090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MaterialsHub" />

    <!-- Capture the install prompt as early as possible. Chrome's
         `beforeinstallprompt` can fire before the React app mounts and is not
         replayable, so we stash it on window for the in-app "Install app"
         button to replay on demand (see usePwaInstall). -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__mkDeferredInstallPrompt = e;
        window.dispatchEvent(new Event('mk-install-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__mkDeferredInstallPrompt = null;
        window.dispatchEvent(new Event('mk-app-installed'));
      });
    </script>

    <!-- Self-hosted brand fonts — Averta (body/UI) + Aleo (headings). Preload the
         faces that are actually rendered before first paint, so text and headings
         don't reflow when the font swaps in.

         Aleo-REGULAR (400) is not optional and is not a duplicate of Bold. The base
         rule is `h1..h6 { font-weight: var(--font-semibold) }` (600 → Aleo Bold), but
         the global `!important` weight overrides further down index.css collapse
         `.font-semibold` and `.font-medium` to 400 — and most headings in the app carry
         one of those classes. So the majority of headings resolve to Aleo 400, not 700.
         Preloading only Bold meant the face the page really used was discovered by the
         CSS instead: measured landing at ~1090ms, i.e. ~900ms AFTER first paint, so every
         heading rendered in the Georgia fallback and then jumped when Aleo swapped in.
         Both weights are genuinely on the dashboard (hero h1 + stat values are 600/700;
         card titles are 400) — keep both preloaded, and re-measure before dropping either. -->
    <link rel="preload" href="/fonts/Averta-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/Aleo-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/Aleo-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <!-- SEO:START — default head. For /knowledge-base/:slug, the api/kb-prerender
         serverless function replaces everything between these markers at request
         time with the article's real title / description / OG / JSON-LD, so
         non-JS scrapers (social unfurlers, crawlers) see correct metadata. -->
    <!--SEO-->
    <title>MaterialsHub — Materials Intelligence Platform</title>
    <meta name="description" content="MaterialsHub: discover materials, manage catalogs, and find installation guides and how-to answers in the knowledge base." />
    <meta name="author" content="MaterialsHub" />

    <meta property="og:site_name" content="MaterialsHub" />
    <meta property="og:title" content="MaterialsHub — Materials Intelligence Platform" />
    <meta property="og:description" content="Discover materials, manage catalogs, and find installation guides and how-to answers in the knowledge base." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://app.materialshub.gr/mh-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MaterialsHub — Materials Intelligence Platform" />
    <meta name="twitter:image" content="https://app.materialshub.gr/mh-logo.png" />
    <!--/SEO-->
  </head>

  <body>
    <!-- Apply the saved theme + accent before first paint to avoid a flash of the
         wrong colors. Mirrors src/contexts/ThemeContext.tsx (keys: mk-theme default
         dark, mk-accent default green). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem('mk-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          root.classList.toggle('dark', t === 'dark');
          root.classList.toggle('light', t === 'light');
        } catch (e) {
          root.classList.add('dark');
        }
        try {
          var a = localStorage.getItem('mk-accent');
          if (a !== 'green' && a !== 'blue') a = 'green';
          root.setAttribute('data-accent', a);
        } catch (e) {
          root.setAttribute('data-accent', 'green');
        }
      })();
    </script>
    <!-- Boot watchdog. A bundle that throws before React mounts leaves #root empty and
         reports NOTHING, because Sentry initialises inside that same bundle — which is
         exactly how a client with stale storage presents as a white screen. Purge the
         client once and reload; if it is still blank after that, say what happened
         rather than showing a blank page. The HTML is `no-store`, so this script
         reaches a broken client even when every module on the page fails. -->
    <script>
      (function () {
        var GUARD = 'mk-boot-recovered';
        var BOOT_TIMEOUT_MS = 12000;
        var BOOT_POLL_MS = 2000;
        var BOOT_CEILING_MS = 45000;
        var firstError = null;

        window.addEventListener('error', function (e) {
          if (!firstError) firstError = (e && e.message) || 'script error';
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          if (!firstError) firstError = String((r && r.message) || r || 'promise rejection');
        });

        function settled(p) { return p.catch(function () {}); }

        /** Everything this origin can hold that survives a reload. */
        function purge() {
          var jobs = [];
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) { /* no service worker API */ }
          try {
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) { /* no Cache Storage */ }
          try {
            if (window.indexedDB && indexedDB.databases) {
              jobs.push(indexedDB.databases().then(function (dbs) {
                return Promise.all(dbs.map(function (d) {
                  return d && d.name ? indexedDB.deleteDatabase(d.name) : null;
                }));
              }));
            }
          } catch (e) { /* Safari exposes no databases() before 14 */ }
          try { localStorage.clear(); } catch (e) { /* storage blocked */ }
          try { sessionStorage.clear(); } catch (e) { /* storage blocked */ }
          return Promise.all(jobs.map(settled));
        }

        /**
         * Built with DOM calls, never an HTML string: `detail` carries an arbitrary
         * error message and invariant 11 forbids assembling markup around one.
         */
        function panel(detail) {
          var host = document.getElementById('root');
          if (!host) return;
          var dark = document.documentElement.classList.contains('dark');
          var fg = dark ? '#e8e6ea' : '#1b1a1f';
          var muted = dark ? '#a09daa' : '#5d5a66';

          host.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;'
            + 'background:' + (dark ? '#0a090e' : '#faf9f5') + ';color:' + fg
            + ';font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';

          var box = document.createElement('div');
          box.style.cssText = 'max-width:420px;width:100%';

          var h = document.createElement('h1');
          h.textContent = 'MaterialsHub could not start';
          h.style.cssText = 'margin:0 0 10px;font-size:19px;font-weight:600';

          var p = document.createElement('p');
          p.textContent = 'We cleared this device’s saved data and tried again, and the app still '
            + 'did not load. This is a fault on our side, not something you did wrong.';
          p.style.cssText = 'margin:0 0 16px;color:' + muted;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Try again';
          btn.style.cssText = 'appearance:none;border:0;border-radius:4px;padding:10px 18px;font:inherit;'
            + 'font-weight:600;cursor:pointer;background:#d81b74;color:#fff';
          btn.addEventListener('click', function () {
            try { sessionStorage.removeItem(GUARD); } catch (e) { /* storage blocked */ }
            location.reload();
          });

          box.appendChild(h);
          box.appendChild(p);
          box.appendChild(btn);

          if (detail) {
            var code = document.createElement('p');
            code.textContent = detail;
            code.style.cssText = 'margin:16px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;'
              + 'font-size:11px;color:' + muted + ';word-break:break-word';
            box.appendChild(code);
          }

          host.appendChild(box);
        }

        /**
         * Slowness is not failure. A phone on a bad connection is still DOWNLOADING the
         * bundle at 12s, and purging it there would log real users out for the crime of
         * poor reception — so wait for `readyState === 'complete'` (every resource
         * fetched, the module script run or thrown) and only then call an empty #root a
         * dead boot. The ceiling covers a resource that never settles at all.
         */
        var waitedMs = 0;
        function check() {
          if (window.__mkBooted) return;
          if (document.readyState !== 'complete' && waitedMs < BOOT_CEILING_MS) {
            waitedMs += BOOT_POLL_MS;
            setTimeout(check, BOOT_POLL_MS);
            return;
          }
          var tried = false;
          try { tried = sessionStorage.getItem(GUARD) === '1'; } catch (e) { /* storage blocked */ }
          if (tried) { panel(firstError); return; }
          purge().then(function () {
            try { sessionStorage.setItem(GUARD, '1'); } catch (e) { /* storage blocked */ }
            location.reload();
          });
        }
        setTimeout(check, BOOT_TIMEOUT_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
