# Semgrep security gate (pentest #250) — runs the invariant ruleset on PRs + pushes.
#
# STATUS: BLOCKING as of 2026-07-20. A finding fails the build.
#
# It was report-only (`|| true`) pending triage of "existing legitimate matches" — but the
# ruleset was INVALID YAML (an unquoted pattern containing `": F"` parsed as a mapping), so
# semgrep loaded ZERO rules and exited non-zero on every run. `|| true` swallowed that, and the
# job reported success. The gate had never evaluated a single rule since it was added.
#
# With the YAML fixed the real finding count is 0, so there was nothing to triage and the gate
# went straight to blocking. Two things keep it honest:
#   • no `|| true` — an invalid config now fails the build instead of hiding, which is the
#     specific failure that made this dead. Do not re-add it.
#   • tests/unit/semgrepRuleset.test.ts parses the YAML in the unit tier, so a malformed
#     ruleset fails fast even before this job pulls its container.
# If a legitimate match ever appears, annotate it at the source with `// nosemgrep: <rule-id>`
# and say why — never by weakening this step.
name: 🔒 Semgrep Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  semgrep:
    name: Scan (invariant ruleset)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep (blocking)
        run: |
          semgrep \
            --config .github/semgrep-security.yml \
            --severity ERROR --severity WARNING \
            --exclude node_modules --exclude dist \
            --error

  # Semgrep matches one site at a time. "This door checks ownership and that one doesn't" is a
  # comparison ACROSS sites, so both #294 S1 findings were invisible to any per-site rule. This
  # job covers that shape. It self-tests before it scans — it feeds itself #294 S1 as originally
  # written and asserts it still flags it — so a detector that has stopped detecting fails the
  # build instead of reporting a clean codebase.
  tenancy:
    name: Tenancy parity (two-doors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check tenancy parity (blocking)
        run: node scripts/check-tenancy-parity.mjs
