name: 🔒 Secret Scanning with Gitleaks

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: 🔒 Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for Gitleaks Enterprise
        with:
          config-path: .gitleaks.toml

      - name: 📊 Upload SARIF results
        if: failure()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: ✅ Success
        if: success()
        run: |
          echo "✅ No secrets detected in the repository!"
          echo "The codebase is clean and safe to deploy."

      - name: ❌ Secrets Found
        if: failure()
        run: |
          echo "❌ SECRETS DETECTED!"
          echo ""
          echo "🚨 One or more secrets were found in your code."
          echo ""
          echo "Next steps:"
          echo "  1. Review the gitleaks output above"
          echo "  2. Remove the secrets from your code"
          echo "  3. Rotate any exposed credentials immediately"
          echo "  4. Add secrets to environment variables instead"
          echo "  5. Update .gitleaks.toml if this is a false positive"
          echo ""
          echo "⚠️ DO NOT ignore these findings - exposed secrets are a critical security risk!"
          exit 1
