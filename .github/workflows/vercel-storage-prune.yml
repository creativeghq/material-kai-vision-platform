# Vercel deployment-storage prune.
#
# Deleting deployments orphaned a static vendor chunk on 2026-09-11 and took the app down, so
# every run probes the live site before and after, and the scheduled run is deliberately more
# conservative than a hand-driven one.
name: Vercel storage prune

on:
  # Sunday 09:00 UTC = 12:00 Athens. Daytime ON PURPOSE: this can break production, and a 03:00
  # cron means the failure email lands while nobody is reading it.
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete (unchecked = dry run)'
        type: boolean
        default: false
      keep:
        description: 'Always spare the newest N deployments'
        default: '20'
      min_age_days:
        description: 'Never delete anything younger than this many days'
        default: '7'
      limit:
        description: 'Maximum deletions in one run'
        default: '200'

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `inputs.*` are EMPTY on a schedule event, so reading them directly would make the weekly
      # run a dry run that deletes nothing and reports success — a cron that looks healthy and
      # does no work. Resolve the settings per event instead, and print them.
      - name: ⚙️ Settings for this run
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Unattended, so it leaves more rope than a run someone is watching: a wider
            # newest-N floor and double the age floor.
            echo "apply=true"      >> "$GITHUB_OUTPUT"
            echo "keep=30"         >> "$GITHUB_OUTPUT"
            echo "min_age=14"      >> "$GITHUB_OUTPUT"
            echo "limit=200"       >> "$GITHUB_OUTPUT"
            echo "weekly scheduled run: apply=true keep=30 min_age_days=14 limit=200"
          else
            echo "apply=${{ inputs.apply }}"         >> "$GITHUB_OUTPUT"
            echo "keep=${{ inputs.keep }}"           >> "$GITHUB_OUTPUT"
            echo "min_age=${{ inputs.min_age_days }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}"         >> "$GITHUB_OUTPUT"
            echo "manual run: apply=${{ inputs.apply }} keep=${{ inputs.keep }} min_age_days=${{ inputs.min_age_days }} limit=${{ inputs.limit }}"
          fi

      # Before, so a prune never runs on top of an existing outage and cannot be blamed for one.
      - name: 🔍 Live site BEFORE
        run: node scripts/probe-live-frontend.mjs "https://app.materialshub.gr"

      - name: 🧹 Prune
        run: |
          set -euo pipefail
          node scripts/prune-vercel-deployments.mjs \
            ${{ steps.cfg.outputs.apply == 'true' && '--apply' || '' }} \
            --keep "${{ steps.cfg.outputs.keep }}" \
            --min-age-days "${{ steps.cfg.outputs.min_age }}" \
            --limit "${{ steps.cfg.outputs.limit }}"

      # The rule this repo already has for janitors: probe the world, not the exit code. Every
      # delete can return 200 while the live site is now missing a chunk — different facts.
      - name: 🔍 Live site AFTER
        if: ${{ steps.cfg.outputs.apply == 'true' }}
        run: |
          set -euo pipefail
          sleep 15
          node scripts/probe-live-frontend.mjs "https://app.materialshub.gr"

      - name: 🚨 If the site broke, say what to do
        if: ${{ failure() && steps.cfg.outputs.apply == 'true' }}
        run: |
          echo "The prune ran and the live site is now failing." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A deleted deployment most likely orphaned a static chunk the live build still" >> "$GITHUB_STEP_SUMMARY"
          echo "references. Fix by RENAMING the affected chunk in vite.config.ts manualChunks" >> "$GITHUB_STEP_SUMMARY"
          echo "(the edge cache key is the filename) and redeploying. Deleted deployments are" >> "$GITHUB_STEP_SUMMARY"
          echo "also restorable for 30 days from the Vercel dashboard." >> "$GITHUB_STEP_SUMMARY"
