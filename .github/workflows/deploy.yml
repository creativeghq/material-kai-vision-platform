name: 🚀 Deploy FE & Supabase

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'supabase/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.json'
      - 'index.html'
      - 'vercel.json'
      # Test-only commits must run too: without this a change to tests/** never
      # triggered the workflow, so a new or edited live suite reported green
      # having never executed.
      - 'tests/**'
      # Same trap, same fix, for the two guards whose INPUT lives outside src/:
      #  - docs/**   → tests/unit/docLinks.test.ts. A docs-only commit is exactly
      #    when a link breaks, and it was the one commit shape that never ran the
      #    link guard.
      #  - scripts/**→ tests/unit/edgeEndpointsCoverage.test.ts. edge-endpoints.json
      #    is the source of the PUBLIC OpenAPI spec; editing it alone must re-check
      #    it against the real functions.
      # Cheap: deploy-frontend/typecheck stay gated on changes.outputs.frontend, so
      # a docs-only push runs the guards and skips every deploy job.
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: '📝 Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string
      force_full_functions_deploy:
        description: 'Force redeploy ALL Supabase functions (ignore diff)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────
  # changes: figure out what's affected, and which functions to deploy.
  # Subsequent jobs gate on these outputs so we skip work cleanly.
  # ────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      functions: ${{ steps.filter.outputs.functions }}
      shared: ${{ steps.filter.outputs.shared }}
      tests: ${{ steps.filter.outputs.tests }}
      changed_functions: ${{ steps.changed-functions.outputs.list }}
      changed_functions_count: ${{ steps.changed-functions.outputs.count }}
    steps:
      - name: 📥 Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'tsconfig.json'
              - 'index.html'
              - 'vercel.json'
            functions:
              - 'supabase/functions/**'
            shared:
              - 'supabase/functions/_shared/**'
            tests:
              - 'tests/**'

      - name: 🧮 Compute changed functions
        id: changed-functions
        run: |
          set -euo pipefail
          FUNCS=""

          # Case 1: manual run, or explicit "force all" toggle.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.inputs.force_full_functions_deploy }}" = "true" ]; then
            echo "ℹ️  Manual / forced run — deploying ALL functions"
            FUNCS=$(ls -d supabase/functions/*/ 2>/dev/null | xargs -n1 basename | grep -v '^_shared$' || true)

          # Case 2: _shared changed — every dependent must redeploy.
          # Walking the import graph is more work than it saves; redeploy all.
          elif [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            echo "ℹ️  supabase/functions/_shared/** changed — deploying ALL functions"
            FUNCS=$(ls -d supabase/functions/*/ 2>/dev/null | xargs -n1 basename | grep -v '^_shared$' || true)

          # Case 3: normal diff-based selection.
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              # First push to branch / force-push / squash — fall back to HEAD~1.
              BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
              echo "⚠️  github.event.before unusable; falling back to $BASE"
            fi
            echo "ℹ️  Diffing $BASE..${{ github.sha }}"
            FUNCS=$(git diff --name-only "$BASE" "${{ github.sha }}" \
                    | grep -oP '^supabase/functions/\K[^/]+(?=/)' \
                    | grep -v '^_shared$' \
                    | sort -u || true)
          fi

          # Filter to directories that still exist and have index.ts.
          VALID=""
          for f in $FUNCS; do
            if [ -f "supabase/functions/$f/index.ts" ]; then
              VALID="$VALID $f"
            fi
          done
          VALID=$(echo "$VALID" | xargs || true)

          COUNT=$(echo "$VALID" | wc -w | tr -d ' ')
          echo "📦 Functions to deploy ($COUNT): $VALID"
          echo "list=$VALID" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 📋 Summary
        run: |
          echo "## 📊 Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Area | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.filter.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase functions | ${{ steps.filter.outputs.functions }} |" >> $GITHUB_STEP_SUMMARY
          echo "| _shared/ | ${{ steps.filter.outputs.shared }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions to deploy | ${{ steps.changed-functions.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.changed-functions.outputs.list }}" ]; then
            echo "**Targets:** \`${{ steps.changed-functions.outputs.list }}\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ────────────────────────────────────────────────────────────────────
  # typecheck: gate for the frontend deploy. Skipped when no FE change.
  # ────────────────────────────────────────────────────────────────────
  typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # ────────────────────────────────────────────────────────────────────
  # unit-tests: hermetic Vitest suite — pure decimal/formula logic + the
  # edge⇄frontend blueprint-formula parity check. No secrets, no network;
  # runs on every push as a fast gate.
  # ────────────────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # Lint is a gate as of 2026-07-16 (it never was, so 3468 errors accumulated
      # unnoticed — including 9 real react-hooks/rules-of-hooks violations).
      # `npm run lint` = eslint . --max-warnings 316 → ZERO errors tolerated; the
      # 316 remaining no-unused-vars WARNINGS are ratcheted at today's count so
      # they can only go down. When you clear some, lower the number in
      # package.json; never raise it.
      - run: npm run lint

  # ────────────────────────────────────────────────────────────────────
  # deploy-frontend: prebuilt Vercel upload (no double build).
  # ────────────────────────────────────────────────────────────────────
  deploy-frontend:
    needs: [changes, typecheck]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build (Vercel, local)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy prebuilt artifact
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🌐 Deployed: $URL"

      - name: 🏥 Health check
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          sleep 10
          # This step used to only WARN on a bad status, so a deploy serving 500s (or a URL that
          # never got captured) reported green — the same "looks checked, isn't" shape as the
          # semgrep `|| true`. It gates now. 302 is the normal response for the prod URL.
          if [ -z "$URL" ]; then
            echo "❌ Deployment URL not captured — cannot verify the deploy"; exit 1
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --connect-timeout 30 --max-time 60 || echo "000")
          echo "📊 HTTP $HTTP_STATUS — $URL"
          case "$HTTP_STATUS" in
            200|301|302|307|308) echo "✅ Healthy" ;;
            *) echo "❌ Unhealthy: HTTP $HTTP_STATUS"; exit 1 ;;
          esac

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🚀 Frontend Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** https://materialshub.gr" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────
  # deploy-functions: parallel selective deploy.
  # Runs in parallel with the frontend job. Skipped if no functions changed.
  # ────────────────────────────────────────────────────────────────────
  deploy-functions:
    needs: changes
    # Run when the diff touched functions, OR on a manual/forced dispatch (the changes job fills
    # changed_functions with ALL functions in that case — gating on the paths-filter `functions`
    # output alone made the force_full_functions_deploy toggle inert on a frontend-only HEAD).
    if: >-
      (needs.changes.outputs.functions == 'true'
       || github.event_name == 'workflow_dispatch'
       || github.event.inputs.force_full_functions_deploy == 'true')
      && needs.changes.outputs.changed_functions_count != '0'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Deploy changed functions (parallel)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          FUNCS: ${{ needs.changes.outputs.changed_functions }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/deploy-logs
          FAILED_FILE=$(mktemp)
          export FAILED_FILE

          echo "📦 Deploying $(echo "$FUNCS" | wc -w | tr -d ' ') function(s): $FUNCS"
          echo "🔧 Project: $PROJECT_REF"
          echo ""

          deploy_one() {
            local name="$1"
            local log="/tmp/deploy-logs/$name.log"
            if supabase functions deploy "$name" --no-verify-jwt --project-ref "$PROJECT_REF" >"$log" 2>&1; then
              echo "✅ $name"
            else
              echo "❌ $name"
              echo "$name" >> "$FAILED_FILE"
              echo "─── log: $name ───"
              tail -n 40 "$log"
              echo "─── end log: $name ───"
            fi
          }
          export -f deploy_one
          export PROJECT_REF SUPABASE_ACCESS_TOKEN

          # Deploy SEQUENTIALLY (-P 1). The Supabase CLI is NOT safe to run
          # concurrently against one project from one runner: parallel
          # `supabase functions deploy` processes share ~/.supabase (auth/config)
          # and the esbuild bundling temp dir, and contend on the Management API.
          # Under contention some functions silently get a no-op/stale upload
          # while still exiting 0 — the job prints ✅ but the content never
          # changes. This bit us on 2026-06-01 (functions reported deployed but
          # ran old code). The pre-2026-05-23 job was sequential and correct;
          # keep it that way. Slower, but every deploy actually lands.
          echo "$FUNCS" | tr ' ' '\n' | xargs -P 1 -I {} bash -c 'deploy_one "$@"' _ {}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -s "$FAILED_FILE" ]; then
            echo "❌ Failed functions:"
            cat "$FAILED_FILE"
            echo ""
            # ANY failed function fails the job (2026-07-17). This used to fail only
            # when `agent-chat` was in the list and log "non-critical, continuing" for
            # everything else — so 94 of 95 functions could fail to deploy and the
            # workflow still reported success, leaving prod on old code. That is the
            # exact outcome the sequential-deploy comment above exists to prevent
            # (the 2026-06-01 "reported deployed but ran old code" incident); the
            # failure handler was quietly re-opening the same hole for stripe-webhooks,
            # finance-*, hr-api and every other function.
            # A failed deploy is never non-critical: the repo and prod have diverged.
            echo "💥 $(wc -l < "$FAILED_FILE" | tr -d ' ') function(s) failed to deploy — failing the job."
            echo "   Prod is now running OLD code for the functions listed above."
            echo "   Re-run the workflow; if it persists, deploy that function manually and investigate."
            exit 1
          else
            echo "✅ All $(echo "$FUNCS" | wc -w | tr -d ' ') functions deployed"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 📦 Supabase Functions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed:** ${{ needs.changes.outputs.changed_functions_count }} function(s)" >> $GITHUB_STEP_SUMMARY
          echo "- **Targets:** \`${{ needs.changes.outputs.changed_functions }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # Post-deploy smoke gate — verify the critical prod flows are actually alive right
  # after a deploy. A FAIL here turns this run red so breakage is caught in seconds,
  # not days via a churned customer. Same script as the scheduled smoke monitor.
  smoke:
    needs: [deploy-frontend, deploy-functions]
    if: ${{ always() && (needs.deploy-frontend.result == 'success' || needs.deploy-functions.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 🔥 Production smoke checks
        env:
          MIVAA_BASE_URL: 'https://v1api.materialshub.gr'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIVAA_CRON_SECRET: ${{ secrets.MIVAA_CRON_SECRET }}
        run: node scripts/smoke/smoke.mjs

  # ────────────────────────────────────────────────────────────────────────────
  # Front-end route-load smoke — drives the deployed app in a headless browser and asserts
  # every top route renders (no white-screen / chunk-load failure / error boundary). Catches
  # the exact class that took down /quotes /finance /discover after a deploy.
  fe-smoke:
    needs: [deploy-frontend]
    if: ${{ always() && needs.deploy-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 🖥️ Front-end route-load smoke
        env:
          SMOKE_BASE_URL: 'https://app.materialshub.gr'
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: npx playwright test --reporter=line

  # ────────────────────────────────────────────────────────────────────────────
  # integration-tests — live-system Vitest suites: cross-workspace RLS isolation
  # (crm_companies) + the blueprint money-path contract. Creates throwaway
  # e2e-…@materialshub.gr users/workspaces on prod and tears them down inline;
  # cleanup_test_artifacts is the backstop. The tenancy suite self-SKIPs unless
  # BOTH SUPABASE_SERVICE_ROLE_KEY and SUPABASE_ANON_KEY are set, so a missing
  # secret degrades to "contract test only" instead of a red deploy.
  # A test-only commit deploys nothing, so both deploy jobs skip and the two result
  # checks below are false — gate on changes.tests as well, or an edited suite would
  # skip silently and report green having never run.
  integration-tests:
    needs: [changes, deploy-frontend, deploy-functions]
    if: ${{ always() && (needs.deploy-frontend.result == 'success' || needs.deploy-functions.result == 'success' || needs.changes.outputs.tests == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The suites self-SKIP without both keys so `npm test` stays green on a no-secret
      # checkout. In CI that same skip would silently retire the tenancy + money-path
      # coverage while still reporting success, so require the secrets HERE.
      - name: 🔑 Require integration credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "${SUPABASE_ANON_KEY:-}" ] || missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Missing secret(s):$missing — the live suites would SKIP and report green."
            exit 1
          fi
          echo "✅ Integration credentials present"
      - name: 🔗 Live integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run test:integration
