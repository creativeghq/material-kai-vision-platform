name: 🚀 Deploy FE & Supabase

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'supabase/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.json'
      - 'index.html'
      - 'vercel.json'
      # Test-only commits must run too: without this a change to tests/** never
      # triggered the workflow, so a new or edited live suite reported green
      # having never executed.
      - 'tests/**'
      # Same trap, same fix, for the two guards whose INPUT lives outside src/:
      #  - docs/**   → tests/unit/docLinks.test.ts. A docs-only commit is exactly
      #    when a link breaks, and it was the one commit shape that never ran the
      #    link guard.
      #  - scripts/**→ tests/unit/edgeEndpointsCoverage.test.ts. edge-endpoints.json
      #    is the source of the PUBLIC OpenAPI spec; editing it alone must re-check
      #    it against the real functions.
      # Cheap: deploy-frontend/typecheck stay gated on changes.outputs.frontend, so
      # a docs-only push runs the guards and skips every deploy job.
      - 'docs/**'
      - 'scripts/**'
      # Third instance of the same trap: a change to the WORKFLOW ITSELF didn't match any
      # path, so edits to this file never ran it. The health-check and credential-gate steps
      # were both committed and never executed once. A CI change you cannot observe is not a
      # CI change. (Deploy jobs stay gated on changes.outputs.*, so a workflow-only push runs
      # the guards and skips every deploy.)
      - '.github/workflows/**'
      - '.github/semgrep-security.yml'
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: '📝 Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string
      force_full_functions_deploy:
        description: 'Force redeploy ALL Supabase functions (ignore diff)'
        required: false
        default: false
        type: boolean

# ────────────────────────────────────────────────────────────────────────────────────────
# Concurrency is per-JOB, not per-workflow, and that distinction is the whole point.
#
# It used to be one workflow-level `deploy-frontend-prod` group with `cancel-in-progress:
# false`, which serialized ENTIRE RUNS — including the hermetic gates, which contend for
# nothing. Measured 2026-08-19: five pushes between 07:37 and 08:17 took 38 minutes end to
# end, ~13 of it pure waiting, and the push at 07:58 sat 9m09s before a single job started.
# A lint error in that commit was therefore 11 minutes away instead of 2.
#
# So: the gates (changes, typecheck, unit-tests, lint) carry NO group and start immediately
# on every push — every commit still gets its own verdict. Only the jobs that touch a shared
# external resource are grouped, each in its OWN group (a shared group would make
# deploy-frontend and deploy-functions cancel each other WITHIN one run, since they run
# concurrently).
#
# Those groups cancel in progress, which is safe here BY DESIGN rather than by luck: the
# `deployed/frontend` / `deployed/functions` markers are moved only by a successful deploy,
# so a superseded run's work stays in the next run's diff and redeploys by itself (see the
# marker comment in `changes`). A burst of five pushes now collapses into one deploy that
# ships all five.
#
# The honest cost, stated because it is real: cancelling deploy-functions mid-sweep leaves
# prod running old code for the functions it had not reached yet, until the superseding run
# finishes. That is an EXTENSION of an existing window, not a new failure mode — the sweep is
# sequential by necessity (see the comment on it), so prod is mixed-version for ~5 minutes on
# every normal functions deploy already. What the markers guarantee is that it converges.
# ────────────────────────────────────────────────────────────────────────────────────────

jobs:
  # ────────────────────────────────────────────────────────────────────
  # changes: figure out what's affected, and which functions to deploy.
  # Subsequent jobs gate on these outputs so we skip work cleanly.
  # ────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.areas.outputs.frontend }}
      # Both function verdicts are DERIVED in `changed-functions`, from one diff taken against
      # the FUNCTIONS marker. They used to come from paths-filter, which takes a single base and
      # it is the frontend's — see the comment on that step for why that is not a detail.
      functions: ${{ steps.changed-functions.outputs.functions_changed }}
      shared: ${{ steps.changed-functions.outputs.shared_changed }}
      tests: ${{ steps.filter.outputs.tests }}
      changed_functions: ${{ steps.changed-functions.outputs.list }}
      changed_functions_count: ${{ steps.changed-functions.outputs.count }}
    steps:
      - name: 📥 Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── What is ACTUALLY live ────────────────────────────────────────────────
      #
      # Every diff below is taken from the last commit that REACHED PRODUCTION, not from the
      # previous commit. Those are different things the moment a run does not finish, and the
      # difference is silent: a superseding push cancels a deploy, the next push touches other
      # paths, `changes` says "no frontend change" against a parent whose frontend never shipped,
      # and CI goes green over a build that is missing work. That happened on 2026-08-17 —
      # d02b5c79's frontend was cancelled mid-flight, 61c3b192 was test-only, and two fixes sat on
      # main unshipped behind a green tick.
      #
      # The markers are moved ONLY by a successful deploy (see the `mark-deployed-*` jobs), so
      # anything stranded by a cancellation is still in the diff on the next run and redeploys by
      # itself. No marker (first run, or the tag was deleted) means "we cannot prove anything is
      # live" and everything deploys — the safe direction.
      - name: 🎯 Resolve the last-deployed markers
        id: base
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true
          for area in frontend functions; do
            TAG="deployed/$area"
            if SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null); then
              echo "✅ $area last deployed at $SHA"
            else
              SHA=""
              echo "⚠️  no $TAG marker — treating everything as undeployed"
            fi
            echo "${area}_base=$SHA" >> "$GITHUB_OUTPUT"
          done

      - name: 🔍 Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Diff against what is live. paths-filter takes ONE base and it is the FRONTEND
          # marker, so this step may only answer FRONTEND questions. That is a hard boundary,
          # not a preference: the two markers say when each area last reached production, and
          # they diverge the moment one deploys and the other does not. On 2026-08-23 the
          # frontend promoted while deploy-functions was cancelled, leaving the functions marker
          # four commits behind — anything measured here would have called that work "already
          # live". Every function verdict is therefore computed in `changed-functions`, against
          # the functions marker. Do not add a `functions:` or `shared:` filter back.
          #
          # An empty base makes paths-filter compare against the default branch, which is why the
          # fallback is handled explicitly in the step after this one rather than by leaving this
          # blank.
          base: ${{ steps.base.outputs.frontend_base }}
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              # Vercel serverless functions (sitemap.xml, kb-prerender) ship with the
              # frontend project. Without this, editing api/* changed nothing in prod —
              # the sitemap fix in 285a4ad silently never deployed.
              - 'api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'tsconfig.json'
              - 'index.html'
              - 'vercel.json'
            tests:
              - 'tests/**'

      - name: 🧭 Resolve the frontend verdict
        id: areas
        run: |
          set -euo pipefail
          # No marker means we cannot prove ANY frontend build is live, so everything is
          # undeployed and everything ships. paths-filter with an empty base falls back to its own
          # default (the push's before-SHA, or the default branch), which on a first run would
          # answer "nothing changed" — the one answer that must never be reachable here.
          if [ -z "${{ steps.base.outputs.frontend_base }}" ]; then
            echo "⚠️  no deployed/frontend marker — treating the frontend as undeployed"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

          # The functions verdict is NOT resolved here. It used to be, from paths-filter, and
          # that is precisely the bug the next step exists to close: the gate said one thing
          # (measured against the frontend marker) while the list said another (measured against
          # the functions marker), and `count=5, functions=false` was reachable — the job skipped
          # with five functions pending, so the marker never moved and they stayed stranded until
          # some later commit happened to touch a function directory. One diff, one answer.

      - name: 🧮 Compute changed functions
        id: changed-functions
        run: |
          set -euo pipefail
          # A function is a directory with an `index.ts`, not merely a directory. `_shared` is
          # excluded by name; the entrypoint test covers everything else, including a stray
          # `supabase/functions/node_modules/` — which `deno check --node-modules-dir=auto`
          # drops in exactly that spot, and which would otherwise reach
          # `supabase functions deploy node_modules` and fail the whole job.
          ALL=$(
            for d in supabase/functions/*/; do
              n=$(basename "$d")
              if [ "$n" != "_shared" ] && [ -f "$d/index.ts" ]; then echo "$n"; fi
            done
          )
          FUNCS=""
          SHARED=false

          # Case 1: manual run, or explicit "force all" toggle.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.inputs.force_full_functions_deploy }}" = "true" ]; then
            echo "ℹ️  Manual / forced run — deploying ALL functions"
            FUNCS="$ALL"

          # Case 2: no marker — nothing can be proven live, so everything ships.
          elif [ -z "${{ steps.base.outputs.functions_base }}" ]; then
            echo "ℹ️  No deployed/functions marker — deploying ALL functions"
            FUNCS="$ALL"

          # Case 3: diff against the last commit whose FUNCTIONS actually deployed.
          else
            BASE="${{ steps.base.outputs.functions_base }}"
            echo "ℹ️  Diffing $BASE..${{ github.sha }} (last DEPLOYED functions commit, not HEAD~1)"
            DIFF=$(git diff --name-only "$BASE" "${{ github.sha }}" || true)

            # _shared changed — every dependent must redeploy. Walking the import graph is more
            # work than it saves; redeploy all.
            #
            # The question is asked HERE, against the functions marker, and that placement is the
            # whole fix. It used to read paths-filter's `shared` output, which is measured against
            # the FRONTEND marker — and the two diverge the moment one area deploys and the other
            # does not. On 2026-08-23 the frontend promoted while deploy-functions was cancelled,
            # so a module added in the superseded commit sat BEHIND the frontend base and the
            # question answered "no". The directory scan below still catches every function whose
            # own files changed; a function that merely IMPORTS the new module has an untouched
            # directory, so it would never ship. Nothing goes red — the importer keeps running old
            # code, and the only symptom is that whatever the new module does silently does not
            # happen.
            if printf '%s\n' "$DIFF" | grep -q '^supabase/functions/_shared/'; then
              SHARED=true
              echo "ℹ️  supabase/functions/_shared/** changed since the last functions deploy — deploying ALL"
              FUNCS="$ALL"
            else
              # sed, not `grep -oP '\K'`. PCRE is a build option AND refuses to run outside a
              # unibyte/UTF-8 locale, so the identical command that works on the runner dies with
              # "grep: -P supports only unibyte and UTF-8 locales" on the machine of anyone
              # reproducing this by hand — and an extraction that comes back empty deploys
              # nothing while printing a cheerful "0 functions".
              FUNCS=$(printf '%s\n' "$DIFF" \
                      | sed -n 's|^supabase/functions/\([^/][^/]*\)/.*|\1|p' \
                      | grep -v '^_shared$' \
                      | sort -u || true)
            fi
          fi

          # Filter to directories that still exist and have index.ts.
          VALID=""
          for f in $FUNCS; do
            if [ -f "supabase/functions/$f/index.ts" ]; then
              VALID="$VALID $f"
            fi
          done
          VALID=$(echo "$VALID" | xargs || true)

          COUNT=$(echo "$VALID" | wc -w | tr -d ' ')
          echo "📦 Functions to deploy ($COUNT): $VALID"
          echo "list=$VALID" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "shared_changed=$SHARED" >> "$GITHUB_OUTPUT"

          # The job gate and the list are ONE answer. Deriving the verdict FROM the list is what
          # makes the two incapable of disagreeing — which they could, and did, while the gate
          # read paths-filter and the list read this diff.
          if [ "$COUNT" = "0" ]; then
            echo "functions_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "functions_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📋 Summary
        run: |
          echo "## 📊 Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Area | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (since the last FRONTEND deploy) | ${{ steps.areas.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase functions (since the last FUNCTIONS deploy) | ${{ steps.changed-functions.outputs.functions_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| _shared/ (since the last FUNCTIONS deploy) | ${{ steps.changed-functions.outputs.shared_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions to deploy | ${{ steps.changed-functions.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.changed-functions.outputs.list }}" ]; then
            echo "**Targets:** \`${{ steps.changed-functions.outputs.list }}\`" >> $GITHUB_STEP_SUMMARY
          fi

  # ────────────────────────────────────────────────────────────────────
  # typecheck: gate for the frontend deploy. Skipped when no FE change.
  # ────────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────────────
  # regenerate: the committed generated artifacts are DERIVED, so the machine
  # owns them — forgetting `npm run tools:manifest` used to mean a tool that is
  # silently stripped from every toolkit and unreachable by any agent.
  #
  # Why this job does not simply commit-and-carry-on: the deploy jobs check out
  # `github.sha`, i.e. the tree as pushed. Committing the regenerated files here
  # and letting THIS run deploy would ship the stale artifact while turning the
  # repo green — a loud failure converted into a silent one. So instead: if
  # anything drifted, we commit it WITHOUT `[skip ci]`, the deploy jobs sit this
  # round out (`regenerate.outputs.changed`), and the resulting push starts a
  # fresh run whose tree is already correct. That second run regenerates to a
  # no-op, commits nothing, and deploys. It terminates.
  #
  # The backstop is toolkitCoverage.test.ts in `unit-tests`, which now gates the
  # deploy: if this job's push ever silently stops working, the next push goes
  # red on the stale-manifest assertion instead of quietly shipping. (The repo's
  # only previous auto-commit workflow reported success 5 times and never
  # committed anything, because it diffed a file that had been deleted.)
  # ────────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────────────
  # regenerate: keep the COMMITTED generated artifacts in sync with their sources.
  #
  # Correctness does NOT depend on this job. Every job that builds, tests or deploys
  # runs the generators itself first, so a stale artifact can never reach production
  # whatever happens here. This job exists only so the repo on disk matches what CI
  # builds — for local dev, and for reading a diff.
  #
  # That separation is deliberate, and the first version got it wrong. It put a
  # PAT-authenticated checkout on the deploy path, and the very first run proved why
  # that is a mistake: `secrets.GH_TOKEN` is expired (set 2025-10-06), checkout could
  # not authenticate, and BOTH deploys were blocked by a credential that has nothing
  # to do with whether the code is good. The changelog workflow had been carrying that
  # same dead token since October without anyone noticing, because it never once
  # reached a push.
  #
  # So: the built-in GITHUB_TOKEN, and nothing `needs:` this job. A push made with
  # GITHUB_TOKEN does not start a new workflow run — fine, because no follow-up run is
  # needed; this run already builds from a regenerated tree.
  #
  # Unconditional (no `needs`, no `if`): this file's trigger block carries three
  # separate comments about a guard scoped to a path never running for the commit shape
  # that needed it most, and the generators live in `scripts/`.
  # ────────────────────────────────────────────────────────────────────
  regenerate:
    runs-on: ubuntu-latest
    # This job PUSHES to the branch, so it is the one gate that must not run concurrently with
    # itself: two runs regenerating and pushing at once race on the same ref. Only the newest
    # tree is worth regenerating, so cancel rather than queue.
    concurrency:
      group: regenerate-generated-artifacts-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: 🔧 Regenerate committed artifacts
        run: npm run gen:all

      - name: 📝 Commit if anything drifted
        run: |
          set -euo pipefail
          # The tree was clean at checkout, so ANY dirt is generator output. Adding
          # everything (rather than a hardcoded path list) means a generator that gains
          # an output file is covered without editing this workflow.
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ generated artifacts already up to date"
            exit 0
          fi
          echo "♻️ regenerated:"
          git status --porcelain
          git config --local user.email "action@github.com"
          git config --local user.name "Material Kai Vision Platform Bot"
          git add -A
          git commit -m "chore(generated): sync tool manifest + skill twins [skip ci]" -m "Derived artifacts, regenerated by CI because the push that produced them did not. This run already builds from the regenerated tree; the commit only keeps the repo readable."
          # Somebody else pushing mid-run would make this a non-fast-forward. Rebase once.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
          echo "::notice::Generated artifacts were out of date and have been committed."

  typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # ────────────────────────────────────────────────────────────────────
  # unit-tests: hermetic Vitest suite — pure decimal/formula logic + the
  # edge⇄frontend blueprint-formula parity check. No secrets, no network;
  # runs on every push as a fast gate.
  # ────────────────────────────────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `deadSchema.test.ts` scans `mivaa-pdf-extractor/app` as one of its source roots, and
          # without this that directory is EMPTY here while being populated on every dev box.
          # The scan then finds no Python reference to any table MIVAA owns and reports 39 live
          # tables as dead — including four the daily job-search cron had written that morning.
          # Green locally, red in CI, and the red was wrong. MIVAA is public, so the default
          # token is enough.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Generated artifacts are DERIVED — the machine owns them, so the suite runs against
      # a regenerated tree. That makes toolkitCoverage's "is NOT stale" assertion vacuous
      # HERE, which is the point: forgetting to run a generator is toil, not a defect. Every
      # OTHER assertion in that file — the tool is in a cluster, its factory is actually
      # instantiated, some agent lists it, a quick-start sends only params the schema
      # declares — describes a real design error no generator can fix, and those still gate.
      - run: npm run gen:all
      - run: npm test

  # ────────────────────────────────────────────────────────────────────
  # lint: the eslint + a11y ratchets. Split out of `unit-tests` on 2026-08-19 purely for
  # wall-clock — the three checks ran serially there (test 28s + lint 30s + a11y 31s) on the
  # critical path in front of every deploy, and they are independent.
  #
  # It gates the deploy exactly as it did inside unit-tests: both deploy jobs list it in
  # `needs`, so a red lint still ships nothing. That wiring is the part to keep — the reason
  # lint matters here is that the Deploy workflow is the ONLY thing running it, so a lint-only
  # failure passes typecheck and tests and would otherwise block the deploy silently.
  # ────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Lint the tree as CI BUILDS it, not as it was pushed — a generator output with a lint
      # error must fail here rather than at the next person's `npm run lint`.
      - run: npm run gen:all
      # Lint is a gate as of 2026-07-16 (it never was, so 3468 errors accumulated
      # unnoticed — including 9 real react-hooks/rules-of-hooks violations).
      # `npm run lint` tolerates ZERO errors; the remaining WARNINGS are ratcheted
      # at today's count so they can only go down. The budget is DERIVED — a11y
      # baseline + declared non-a11y debt — and pinned by a11yRatchet.test.ts, so
      # it cannot be raised to go green. When you clear some, lower it there.
      - run: npm run lint
      # The a11y ratchet (per-rule counts in .github/a11y-baseline.json, fails when
      # one RISES). It shipped 2026-08-01 but was never wired into CI, so for its
      # first day it gated nothing while its warnings sat inside the `npm run lint`
      # budget above and turned this job red instead.
      - run: npm run lint:a11y

  # ────────────────────────────────────────────────────────────────────
  # deploy-frontend: prebuilt Vercel upload (no double build).
  # ────────────────────────────────────────────────────────────────────
  deploy-frontend:
    # `unit-tests` was an orphan: it ran `npm test`, `npm run lint` and `lint:a11y`
    # and NOTHING depended on it, so a red suite still shipped to production and the
    # failure was a report rather than a gate. It gates now — and `lint`, which was split
    # out of it, must stay listed here for the same reason.
    needs: [changes, typecheck, unit-tests, lint]
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One build+upload against the Vercel project at a time; newest push wins. A cancelled
    # upload never gets aliased (--skip-domain), so there is nothing to unwind, and the
    # `deployed/frontend` marker stays put so the next run rebuilds it.
    concurrency:
      group: deploy-frontend-vercel
      cancel-in-progress: true
    environment: production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Build from a regenerated tree, so the bundle cannot carry a stale manifest even if
      # the commit-back in `regenerate` failed. Correct by construction, not by convention.
      - name: 🔧 Regenerate committed artifacts
        run: npm run gen:all

      - name: 🔧 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build (Vercel, local)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # --skip-domain is what turns fe-smoke from a post-mortem into a gate. It builds and
      # uploads a PRODUCTION deployment (production env vars, production build) but does NOT
      # move app.materialshub.gr onto it. Users keep getting the previous build until the
      # `promote` job aliases this one, which only happens after the route-load smoke passes.
      # Without this flag the deploy IS the release and every check after it is a post-mortem —
      # which is how a null-crash on `/` and `/discover` reached ~6 users on 2026-08-01.
      - name: 🚀 Deploy prebuilt artifact (unaliased)
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          if [ -z "$URL" ]; then
            echo "❌ Deployment URL not captured — cannot verify or promote"; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🌐 Deployed (NOT yet serving users): $URL"

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🚀 Frontend Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Candidate:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Live only after:** fe-smoke passes → promote" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────
  # promote: the step that actually releases. Moves app.materialshub.gr onto the candidate
  # deploy-frontend uploaded, and ONLY runs when the route-load smoke passed against it.
  #
  # If fe-smoke fails, this is skipped and the previous build keeps serving — no rollback
  # needed, because the broken build was never live. That is the whole point of --skip-domain.
  # ────────────────────────────────────────────────────────────────────
  promote:
    needs: [deploy-frontend, fe-smoke]
    if: ${{ needs.deploy-frontend.result == 'success' && needs.fe-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    # Its own group, separate from deploy-frontend's — sharing one would have the two cancel
    # each other. cancel-in-progress here is what keeps the alias monotonic: if a newer
    # candidate is ready to promote, aliasing the older one first and the newer one second is
    # merely wasteful, but the reverse order would leave the OLD build live behind a green tick.
    concurrency:
      group: promote-vercel-alias
      cancel-in-progress: true
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 🔧 Install Vercel CLI
        run: npm install --global vercel@latest
      - name: 📥 Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🎬 Promote the smoked candidate
        run: |
          set -euo pipefail
          URL="${{ needs.deploy-frontend.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "❌ No candidate URL from deploy-frontend — refusing to promote"; exit 1
          fi
          echo "Promoting $URL"
          # `--non-interactive`, NOT `--yes`: `vercel promote --help` lists only --timeout,
          # --cwd, --no-color and --non-interactive, so --yes would fail as an unknown option
          # and leave the smoked build sitting unreleased.
          vercel promote "$URL" --non-interactive --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏥 Health check the live domain
        run: |
          set -euo pipefail
          # The custom domain, which is exempt from SSO and is what users actually load. This
          # step previously curled the *deployment* URL and accepted 302 — i.e. it asserted that
          # Vercel's login redirect responds, and would have passed on a completely broken build.
          # Measured 2026-08-02: deployment URL -> 302, app.materialshub.gr -> 200.
          URL="https://app.materialshub.gr"
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --connect-timeout 30 --max-time 60 || echo "000")
          echo "📊 HTTP $HTTP_STATUS — $URL"
          case "$HTTP_STATUS" in
            200) echo "✅ Live" ;;
            *) echo "❌ Unhealthy after promote: HTTP $HTTP_STATUS"; exit 1 ;;
          esac

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🎬 Promoted" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Now serving:** ${{ needs.deploy-frontend.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App:** https://app.materialshub.gr" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────
  # deploy-functions: parallel selective deploy.
  # Runs in parallel with the frontend job. Skipped if no functions changed.
  # ────────────────────────────────────────────────────────────────────
  deploy-functions:
    needs: [changes, unit-tests, lint]
    # One condition, because there is now one answer. The count already folds in the manual /
    # forced dispatch (Case 1 fills the list with every function) and the missing marker (Case 2
    # does the same), so the three-way `||` this replaced was not belt-and-braces — it was a
    # SECOND verdict, measured against the frontend marker and free to contradict the list. It
    # could read `false` while the list held five pending functions, and then the job skipped, the
    # marker never moved, and those five stayed stranded until some later commit happened to touch
    # a function directory. If there is something to deploy, deploy it.
    if: needs.changes.outputs.changed_functions_count != '0'
    runs-on: ubuntu-latest
    # One sweep against the Supabase project at a time — the CLI is not safe to run
    # concurrently against one project even from separate runners (see the deploy step's
    # comment: contention makes some functions silently get a stale upload while exiting 0).
    # Cancelling a half-finished sweep is the accepted cost of collapsing bursts: the marker
    # is not moved, so the superseding run redeploys everything this one did not reach.
    concurrency:
      group: deploy-functions-supabase
      cancel-in-progress: true
    environment: production
    steps:
      - uses: actions/checkout@v4
      # `_shared/toolkitClusters.generated.ts` ships inside every function that imports it,
      # so the edge side needs the same regenerate-before-deploy guarantee as the frontend.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: 🔧 Regenerate committed artifacts
        run: npm run gen:all
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Deploy changed functions (parallel)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          FUNCS: ${{ needs.changes.outputs.changed_functions }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/deploy-logs
          FAILED_FILE=$(mktemp)
          export FAILED_FILE

          echo "📦 Deploying $(echo "$FUNCS" | wc -w | tr -d ' ') function(s): $FUNCS"
          echo "🔧 Project: $PROJECT_REF"
          echo ""

          # Bundling resolves remote imports (esm.sh, deno.land) at deploy time, so a CDN blip
          # fails a function that is perfectly fine. Observed 2026-07-20: finance-pay-invoice and
          # generate-quote-pdf both died on `Import 'https://esm.sh/…' failed: 522` while the
          # other 94 deployed. Retry transient failures before declaring the deploy broken —
          # a red deploy nobody can act on trains people to ignore red deploys.
          deploy_one() {
            local name="$1"
            local log="/tmp/deploy-logs/$name.log"
            local attempt
            for attempt in 1 2 3; do
              if supabase functions deploy "$name" --no-verify-jwt --project-ref "$PROJECT_REF" >"$log" 2>&1; then
                if [ "$attempt" -gt 1 ]; then echo "✅ $name (attempt $attempt)"; else echo "✅ $name"; fi
                return 0
              fi
              # Only retry network/CDN-shaped failures; a genuine code error must fail FAST and
              # loud rather than burn three attempts and bury the real message.
              if grep -qiE '5[0-9]{2} <unknown status code>|failed to create the graph|connection (closed|reset)|timed out|error sending request' "$log" \
                 && [ "$attempt" -lt 3 ]; then
                echo "⏳ $name — transient bundling failure, retrying ($attempt/3)"
                sleep $((attempt * 10))
                continue
              fi
              break
            done
            echo "❌ $name"
            echo "$name" >> "$FAILED_FILE"
            echo "─── log: $name ───"
            tail -n 40 "$log"
            echo "─── end log: $name ───"
          }
          export -f deploy_one
          export PROJECT_REF SUPABASE_ACCESS_TOKEN

          # Deploy SEQUENTIALLY (-P 1). The Supabase CLI is NOT safe to run
          # concurrently against one project from one runner: parallel
          # `supabase functions deploy` processes share ~/.supabase (auth/config)
          # and the esbuild bundling temp dir, and contend on the Management API.
          # Under contention some functions silently get a no-op/stale upload
          # while still exiting 0 — the job prints ✅ but the content never
          # changes. This bit us on 2026-06-01 (functions reported deployed but
          # ran old code). The pre-2026-05-23 job was sequential and correct;
          # keep it that way. Slower, but every deploy actually lands.
          echo "$FUNCS" | tr ' ' '\n' | xargs -P 1 -I {} bash -c 'deploy_one "$@"' _ {}

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -s "$FAILED_FILE" ]; then
            echo "❌ Failed functions:"
            cat "$FAILED_FILE"
            echo ""
            # ANY failed function fails the job (2026-07-17). This used to fail only
            # when `agent-chat` was in the list and log "non-critical, continuing" for
            # everything else — so 94 of 95 functions could fail to deploy and the
            # workflow still reported success, leaving prod on old code. That is the
            # exact outcome the sequential-deploy comment above exists to prevent
            # (the 2026-06-01 "reported deployed but ran old code" incident); the
            # failure handler was quietly re-opening the same hole for stripe-webhooks,
            # finance-*, hr-api and every other function.
            # A failed deploy is never non-critical: the repo and prod have diverged.
            echo "💥 $(wc -l < "$FAILED_FILE" | tr -d ' ') function(s) failed to deploy — failing the job."
            echo "   Prod is now running OLD code for the functions listed above."
            echo "   Re-run the workflow; if it persists, deploy that function manually and investigate."
            exit 1
          else
            echo "✅ All $(echo "$FUNCS" | wc -w | tr -d ' ') functions deployed"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Asks the question the deploy has never asked: what is running in production that this
      # repo has no source for? Thirteen such functions had accumulated by 2026-08-11 (#345) —
      # unreadable, unreviewable, unfixable — including one CLAUDE.md described as deleted while
      # v54 of it was still live. Runs AFTER the deploy so it judges the state we just created.
      # `if: always()` because a failed deploy is exactly when "repo function not deployed"
      # matters most, and a red job must not hide the reason.
      - name: 🔍 Deployed-vs-repo drift
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/check-deployed-functions.mjs

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 📦 Supabase Functions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed:** ${{ needs.changes.outputs.changed_functions_count }} function(s)" >> $GITHUB_STEP_SUMMARY
          echo "- **Targets:** \`${{ needs.changes.outputs.changed_functions }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────────────────────
  # Post-deploy smoke gate — verify the critical prod flows are actually alive right
  # after a deploy. A FAIL here turns this run red so breakage is caught in seconds,
  # not days via a churned customer. Same script as the scheduled smoke monitor.
  smoke:
    needs: [deploy-frontend, deploy-functions]
    if: ${{ always() && (needs.deploy-frontend.result == 'success' || needs.deploy-functions.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 🔥 Production smoke checks
        env:
          MIVAA_BASE_URL: 'https://v1api.materialshub.gr'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The anon-denied checks need a REAL anon key; without it they would run as
          # service-role and assert the opposite of what they are named for.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MIVAA_CRON_SECRET: ${{ secrets.MIVAA_CRON_SECRET }}
        run: node scripts/smoke/smoke.mjs

  # ────────────────────────────────────────────────────────────────────────────
  # Front-end route-load smoke — drives the deployed app in a headless browser and asserts
  # every top route renders (no white-screen / chunk-load failure / error boundary). Catches
  # the exact class that took down /quotes /finance /discover after a deploy.
  #
  # NOTE it runs AFTER production is serving the new build, so it DETECTS breakage rather than
  # preventing it. On 2026-08-01 it correctly caught an error boundary on `/` and `/discover` —
  # but only after ~6 users had already hit it.
  #
  # It is now a REAL GATE: deploy-frontend uploads with --skip-domain, so this runs against a
  # production build that no user can reach yet, and `promote` only aliases it if this passes.
  #
  # It targets a *.vercel.app URL, which is behind Vercel SSO (`all_except_custom_domains`) and
  # answers 302 to an auth wall. VERCEL_AUTOMATION_BYPASS_SECRET carries the
  # `x-vercel-protection-bypass` header past it (verified 2026-08-02: 302 without, 200 with —
  # header alone, no `x-vercel-set-bypass-cookie`, which answers 307 and can loop).
  # If that secret ever goes missing the suite would smoke a login page and pass on anything,
  # so tests/e2e/vercelBypass.ts FAILS LOUDLY when the target is protected and the secret isn't set.
  fe-smoke:
    needs: [deploy-frontend]
    if: ${{ always() && needs.deploy-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # `--with-deps` was removed 2026-08-19 and it was the single slowest thing in the
      # pipeline. It ran `apt-get update` + install on every run, and the log says what for:
      #
      #     0 upgraded, 9 newly installed
      #     Fetched 21.1 MB in 3min 16s (107 kB/s)
      #
      # Nine FONT packages — CJK, Thai, Cyrillic, unifont — crawling out of
      # azure.archive.ubuntu.com. Every library Chromium actually links reported "already the
      # newest": the runner image ships them. Measured range 24s–251s across recent runs, all
      # of the variance being that mirror's throughput. The 294 MB of browser binaries from
      # cdn.playwright.dev took ELEVEN SECONDS, and the suite itself takes 20.
      #
      # This job sits in front of `promote`, so that apt call was up to 4 minutes of
      # time-to-live spent on glyph sets no route in this app renders (Latin and Greek are
      # covered by the runner's DejaVu).
      #
      # If a future runner image ever drops a Chromium dependency, this fails loudly at browser
      # launch — restore it by adding a `npx playwright install-deps chromium` step, NOT by
      # putting `--with-deps` back and paying the font download again.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: 🖥️ Front-end route-load smoke
        env:
          # The unaliased production candidate, NOT the live domain — this has to fail before
          # users can reach it. It is a *.vercel.app URL and therefore behind SSO, which is what
          # the bypass secret is for; without the secret Playwright would smoke the login page
          # and pass on anything.
          SMOKE_BASE_URL: ${{ needs.deploy-frontend.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: npx playwright test --reporter=line

  # ────────────────────────────────────────────────────────────────────────────
  # integration-tests — live-system Vitest suites: cross-workspace RLS isolation
  # (crm_companies) + the blueprint money-path contract. Creates throwaway
  # e2e-…@materialshub.gr users/workspaces on prod and tears them down inline;
  # cleanup_test_artifacts is the backstop. The tenancy suite self-SKIPs unless
  # BOTH SUPABASE_SERVICE_ROLE_KEY and SUPABASE_ANON_KEY are set, so a missing
  # secret degrades to "contract test only" instead of a red deploy.
  # A test-only commit deploys nothing, so both deploy jobs skip and the two result
  # checks below are false — gate on changes.tests as well, or an edited suite would
  # skip silently and report green having never run.
  integration-tests:
    needs: [changes, deploy-frontend, deploy-functions]
    if: ${{ always() && (needs.deploy-frontend.result == 'success' || needs.deploy-functions.result == 'success' || needs.changes.outputs.tests == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The suites self-SKIP without both keys so `npm test` stays green on a no-secret
      # checkout. In CI that same skip would silently retire the tenancy + money-path
      # coverage while still reporting success, so require the secrets HERE.
      - name: 🔑 Require integration credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "${SUPABASE_ANON_KEY:-}" ] || missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "❌ Missing secret(s):$missing — the live suites would SKIP and report green."
            exit 1
          fi
          echo "✅ Integration credentials present"
      - name: 🔗 Live integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run test:integration

  # ── The markers that say what is live ────────────────────────────────────────
  #
  # These are the OTHER half of the `changes` job's diff. Each tag moves to the commit that just
  # finished deploying its area, and only then — a cancelled, failed or skipped deploy leaves the
  # marker where it was, so the next run still sees that work as undeployed and ships it.
  #
  # Why a tag and not the last successful RUN: a run can succeed while its deploy was skipped
  # (a test-only commit is green and deploys nothing). "The newest green run" would move the
  # baseline past work that never shipped, which is the bug, one level up.
  #
  # Force-updated on purpose: the tag tracks a moving pointer, not a release.
  mark-deployed-frontend:
    needs: [promote]
    if: ${{ needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 🏷️ Move deployed/frontend to this commit
        run: |
          set -euo pipefail
          git tag -f deployed/frontend "${{ github.sha }}"
          git push -f origin refs/tags/deployed/frontend
          echo "deployed/frontend → ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  mark-deployed-functions:
    needs: [deploy-functions]
    if: ${{ needs.deploy-functions.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 🏷️ Move deployed/functions to this commit
        run: |
          set -euo pipefail
          git tag -f deployed/functions "${{ github.sha }}"
          git push -f origin refs/tags/deployed/functions
          echo "deployed/functions → ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
