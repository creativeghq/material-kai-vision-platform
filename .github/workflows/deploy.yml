name: 🚀 Deploy FE & Supabase

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig.json'
      - 'index.html'
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: '📝 Reason for manual deployment'
        required: false
        default: 'Manual deployment'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 📋 Deployment Overview
        run: |
          echo "🚀 Material KAI Vision Platform Deployment"
          echo "=========================================="
          echo ""
          echo "🎯 Deployment Type: Frontend & Supabase Functions"
          echo "📝 Trigger: ${{ github.event_name == 'push' && 'Automatic (Code Push)' || 'Manual (workflow_dispatch)' }}"
          echo "${{ github.event.inputs.deployment_reason && format('📝 Reason: {0}', github.event.inputs.deployment_reason) || '' }}"
          echo ""
          echo "📊 Deployment Details:"
          echo "  • Target: Vercel (Production)"
          echo "  • Branch: ${{ github.ref_name }}"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Triggered by: ${{ github.actor }}"
          echo ""

          # Add to GitHub Step Summary
          echo "# 🚀 Material KAI Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Deployment Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **🎯 Deployment Type** | Frontend & Supabase Functions |" >> $GITHUB_STEP_SUMMARY
          echo "| **📝 Trigger** | ${{ github.event_name == 'push' && 'Automatic (Code Push)' || 'Manual (workflow_dispatch)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **🌿 Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **📋 Commit** | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **👤 Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **🆔 Deployment ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **⏰ Started** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add deployment progress
          echo "## 🚀 Deployment Progress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Initialization** | ✅ Complete | Deployment started successfully |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dependencies** | 🟡 In Progress | Installing npm packages |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ⏳ Pending | Building frontend application |" >> $GITHUB_STEP_SUMMARY
          echo "| **Supabase Functions** | ⏳ Pending | Deploying edge functions |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vercel Deploy** | ⏳ Pending | Deploying to production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | ⏳ Pending | Verifying deployment |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci
          echo "✅ Dependencies installed successfully"

      - name: 🏗️ Build frontend
        run: |
          echo "🏗️ Building frontend application..."
          npm run build
          echo "✅ Build completed successfully"

          # Update progress
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Build artifacts generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🔧 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Deploy Supabase functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "🚀 Deploying Supabase edge functions..."
          echo "📋 Project Ref: ${{ secrets.SUPABASE_PROJECT_ID }}"
          echo "🔑 Token present: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && 'Yes' || 'No' }}"

          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_ID }}"

          # Test authentication first
          echo "🔍 Testing Supabase authentication..."
          supabase projects list || echo "⚠️ Authentication test failed"

          # Deploy functions one-by-one to avoid container resource exhaustion.
          # Only deploys functions whose code actually changed (Supabase CLI detects this).
          echo "📦 Deploying functions individually..."
          FAILED=""
          DEPLOYED=""
          SKIPPED=""

          for FUNC_DIR in supabase/functions/*/; do
            FUNC_NAME=$(basename "$FUNC_DIR")

            # Skip _shared directory and any non-function dirs
            if [ "$FUNC_NAME" = "_shared" ] || [ ! -f "$FUNC_DIR/index.ts" ]; then
              continue
            fi

            echo "━━━ Deploying: $FUNC_NAME"
            if supabase functions deploy "$FUNC_NAME" --no-verify-jwt --project-ref "$PROJECT_REF" 2>&1 | tee /tmp/deploy_output.txt; then
              if grep -q "No change found" /tmp/deploy_output.txt; then
                SKIPPED="$SKIPPED $FUNC_NAME"
              else
                DEPLOYED="$DEPLOYED $FUNC_NAME"
              fi
            else
              echo "⚠️  Failed to deploy: $FUNC_NAME"
              FAILED="$FAILED $FUNC_NAME"
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          [ -n "$DEPLOYED" ] && echo "✅ Deployed:$DEPLOYED"
          [ -n "$SKIPPED" ] && echo "⏭️  No changes:$SKIPPED"
          [ -n "$FAILED" ] && echo "❌ Failed:$FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Fail the step only if a critical function failed
          if echo "$FAILED" | grep -q "agent-chat"; then
            echo "❌ Critical function agent-chat failed to deploy!"
            exit 1
          fi

          echo "✅ Supabase functions deployment complete"

      - name: 🔧 Install Vercel CLI
        run: |
          echo "🔧 Installing Vercel CLI..."
          npm install --global vercel@latest
          echo "✅ Vercel CLI installed"

      - name: 📥 Pull Vercel Environment Information
        run: |
          echo "📥 Pulling Vercel environment configuration..."
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          echo "✅ Environment configuration pulled"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🚀 Deploy to Vercel
        run: |
          echo "🚀 Deploying to Vercel production..."
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel_output.txt | grep -oP 'https://[^\s]+' | tail -1)
          echo "✅ Deployment completed"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          echo "🌐 Deployment URL: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏥 Deployment Health Check
        run: |
          echo "🏥 Performing deployment health checks..."
          echo "=========================================="

          # Wait for deployment to be ready
          sleep 10

          # Check if deployment URL is available
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "🔍 Testing deployment URL: $DEPLOYMENT_URL"

            # Test the deployment
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL" --connect-timeout 30 --max-time 60 || echo "000")

            echo "📊 Health Check Results:"
            echo "  • Deployment URL: $DEPLOYMENT_URL"
            echo "  • HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ Deployment is healthy and responding"
              HEALTH_STATUS="🟢 Healthy"
            else
              echo "⚠️  Deployment returned status: $HTTP_STATUS"
              HEALTH_STATUS="🟡 Deployed (Status: $HTTP_STATUS)"
            fi
          else
            echo "⚠️  Could not determine deployment URL"
            HEALTH_STATUS="🟡 Deployed (URL not captured)"
          fi

          echo "HEALTH_STATUS=$HEALTH_STATUS" >> $GITHUB_ENV

          echo ""
          echo "🎉 Deployment completed successfully!"
          echo "✅ Frontend: Deployed to Vercel (Production)"
          echo "✅ Backend: Supabase functions deployed"
          echo "📊 Build artifacts: Generated and deployed"

          # Add health check results to summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🏥 Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment URL** | ${DEPLOYMENT_URL:-Not captured} |" >> $GITHUB_STEP_SUMMARY
          echo "| **HTTP Status** | ${HTTP_STATUS:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Status** | $HEALTH_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Final Deployment Summary
        if: always()
        run: |
          echo ""
          echo "🎉 Material KAI Vision Platform Deployment Complete!"
          echo "===================================================="
          echo ""

          # Add final deployment results
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎉 Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Build** | ✅ Success | Vite build completed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Supabase Functions** | ✅ Deployed | Edge functions active |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vercel Deployment** | ✅ Success | Production deployment live |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | ${HEALTH_STATUS:-🟡 Pending} | Deployment verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add service endpoints
          echo "## 🌐 Service Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **🌐 Production App** | [materialshub.gr](https://materialshub.gr) | 🟢 Live |" >> $GITHUB_STEP_SUMMARY
          echo "| **📚 Supabase Dashboard** | [Supabase Project](https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }}) | 🟢 Active |" >> $GITHUB_STEP_SUMMARY
          echo "| **🚀 Vercel Dashboard** | [Vercel Project](https://vercel.com/${{ secrets.VERCEL_ORG_ID }}/${{ secrets.VERCEL_PROJECT_ID }}) | 🟢 Active |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add quick actions
          echo "## 🚀 Quick Actions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 [**Visit Application**](https://materialshub.gr)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 [**View Commit**](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 [**View Deployment**](https://vercel.com/${{ secrets.VERCEL_ORG_ID }}/${{ secrets.VERCEL_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- 🗄️ [**Supabase Dashboard**](https://supabase.com/dashboard/project/${{ secrets.SUPABASE_PROJECT_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Update final deployment progress
          echo "## 🎯 Final Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Initialization** | ✅ Complete | Deployment started successfully |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dependencies** | ✅ Complete | npm packages installed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ✅ Complete | Frontend application built |" >> $GITHUB_STEP_SUMMARY
          echo "| **Supabase Functions** | ✅ Complete | Edge functions deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vercel Deploy** | ✅ Complete | Deployed to production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check** | ✅ Complete | Deployment verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add footer
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Material KAI Vision Platform** | 🕐 Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC') | 📋 ID: \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "✅ Deployment Status: SUCCESS"
          echo "📅 Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🎯 All components deployed successfully!"
