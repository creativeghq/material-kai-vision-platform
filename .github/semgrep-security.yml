# Semgrep security ruleset — enforces the CLAUDE.md "Security Invariants" (pentest #250)
# at PR time so the classes we fixed can't silently regress. High-signal / low-false-
# positive rules only; run via .github/workflows/semgrep.yml.
rules:
  # ── J · XSS / output encoding (invariant 11) ────────────────────────────────
  - id: no-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      XSS (#250 J / invariant 11): dangerouslySetInnerHTML renders raw HTML. Use JSX or
      react-markdown (WITHOUT rehype-raw), or escape with the esc() helper.
    # `dangerouslySetInnerHTML={=~/.*/}` (the original) matches NOTHING — verified against a
    # probe component. It has to be anchored to the JSX element, in both the self-closing and
    # with-children forms, with `...` around it so other props don't defeat the match.
    pattern-either:
      - pattern: <$EL ... dangerouslySetInnerHTML={...} ... />
      - pattern: <$EL ... dangerouslySetInnerHTML={...} ...>...</$EL>

  - id: no-document-write
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      XSS (#250 J1): document.write() with app/user content runs in the page origin and
      can steal the Supabase session. Build DOM safely or escape via esc().
    pattern: document.write(...)

  - id: no-rehype-raw
    languages: [typescript, javascript]
    severity: ERROR
    message: "XSS (#250 J / invariant 11): rehype-raw renders raw HTML from markdown — do not use."
    pattern-either:
      - pattern: require('rehype-raw')
      - pattern: import 'rehype-raw'
      - pattern: import $X from 'rehype-raw'

  # Invariant 11 says "do NOT hand-roll a local copy — the old per-file copies drifted to 3
  # different strengths", but nothing enforced that half of it: the three rules above cover how
  # HTML is RENDERED, none covered how it is ESCAPED. A fourth copy had duly reappeared in
  # _shared/react-email-renderer.ts. It escaped the full set, so it was not a hole — which is the
  # point: a drifted copy is only dangerous later, and by then nobody re-reads it.
  - id: no-local-escape-html
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      XSS (invariant 11): hand-rolled HTML escaper. Import `escapeHtml` from
      `_shared/html.ts` (edge) or `@/utils/escapeHtml` (frontend) — both escape the full
      & < > " ' set and are attribute-safe. Local copies drift.
    paths:
      exclude:
        - "src/utils/escapeHtml.ts"
        - "supabase/functions/_shared/html.ts"
        # Third canonical twin: the Vercel Node functions in api/ are plain ESM .js with no
        # `@/` alias and no TS step, so they can import neither of the two above. Parity of all
        # three is enforced by tests/unit/escapeHtmlParity.test.ts, not by convention.
        - "api/_shared/html.js"
    pattern-either:
      - pattern: function escapeHtml(...) { ... }
      - pattern: const escapeHtml = (...) => { ... }
      - pattern: const escapeHtml = function (...) { ... }

  # ── A · Auth (invariant 1/5) ────────────────────────────────────────────────
  - id: no-jwt-verification-disabled
    languages: [python]
    severity: ERROR
    message: "Auth bypass (#250 A5): JWT decoded with audience/signature verification disabled."
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_aud": False, ...}, ...)'
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'

  # ── G / BOPLA · Mass assignment (invariant 8) ───────────────────────────────
  - id: no-mass-assignment-db-insert
    languages: [python]
    severity: WARNING
    message: >
      Mass-assignment (#250 G / invariant 8): don't spread a request model into a DB write
      — a caller can set trust/identity fields (workspace_id, user_id, role, price). Build
      an allowlisted payload instead.
    pattern-either:
      - pattern: $T.insert($REQ.dict())
      - pattern: $T.insert($REQ.model_dump())
      - pattern: $T.insert(**$REQ.dict())
      - pattern: $T.insert(**$REQ.model_dump())

  # ── #322 · Mass assignment from a STORED payload (invariant 8, TS side) ─────
  # The Python rule above catches a request body spread into a write. The template engine
  # introduced the same hazard from a different direction: `entity_templates.payload` is jsonb
  # read back out of the database, i.e. input that was untrusted when it went in and is untrusted
  # when it comes out. `.insert({ ...payload })` would let any key that ever landed in that column
  # become a column value — workspace_id, price, is_verified. Every adapter must build an explicit
  # object literal. (tests/unit/templateRegistry.test.ts asserts the same thing over adapters.ts;
  # this rule covers every OTHER file that grows a materializer later.)
  #
  # Anchored to PROVENANCE, not to the variable name. The first cut matched `...payload` on sight
  # and produced 9 findings, every one of them safe: real-estate-api builds its payload with
  # `pick(body, PROPERTY_WRITABLE)`, the importer with an `IMPORT_WRITABLE` loop, the rest field by
  # field, and BusinessSection's is a local form-state literal that never touches a request body.
  # Zero true positives, nine false ones — the same mistake no-swallowed-write made below, and the
  # same lesson: it was measuring a naming convention, not the defect. A gate that is wrong nine
  # times out of nine is a gate people learn to force through.
  #
  # Taint mode was tried and is worse here: semgrep's taint is not field-sensitive, so
  # `caption: body.caption` inside a fully explicit literal taints the whole object and `pick()`
  # as a sanitizer does not clear it. It flagged MORE safe code, not less.
  #
  # So the rule binds the same metavariable to the assignment AND the spread: it fires only when
  # the thing being spread IS the raw parsed body or the stored jsonb, with no allowlist in
  # between. Verified against fixtures — fires on all three unsafe shapes (raw body spread, raw
  # body as a whole update, stored `row.payload` spread) and stays silent on the allowlisted
  # form — and across all 1335 scanned files it now reports 0.
  - id: no-mass-assignment-from-stored-payload
    languages: [typescript]
    severity: ERROR
    message: >
      Mass-assignment (#322 / invariant 8): this is the RAW request body or a stored jsonb payload
      going straight into a DB write, so any key the caller invents becomes a column value —
      workspace_id, user_id, role, price, is_verified. Put an allowlist in between
      (`pick(body, WRITABLE)`) or build the object literal field by field.
    pattern-either:
      # The raw parsed request body, spread or written whole.
      - patterns:
          - pattern-inside: |
              const $P = await $REQ.json();
              ...
          - pattern-either:
              - pattern: $T.insert({..., ...$P, ...})
              - pattern: $T.update({..., ...$P, ...})
              - pattern: $T.insert($P)
              - pattern: $T.update($P)
      # A stored jsonb payload read back out of the database (#322's own hazard):
      # untrusted when it went in, still untrusted coming out.
      - patterns:
          - pattern-inside: |
              const $P = $ROW.payload;
              ...
          - pattern-either:
              - pattern: $T.insert({..., ...$P, ...})
              - pattern: $T.update({..., ...$P, ...})
              - pattern: $T.insert($P)
              - pattern: $T.update($P)

  # ── #309 item 6 · Swallowed failure in money / payment paths ───────────────
  # 7 of the 8 swallowed-failure findings across the whole audit were ONE shape: a bare
  # `catch {}` (or a discarded `error`) followed by an unconditional success toast. The user is
  # told the money moved and it did not — PosPage "Receipt issued" with no payments row,
  # real-estate-public "Thanks, we'll be in touch" on a lead never saved, email-unsubscribe
  # "You're unsubscribed" on an opt-out Postgres rejected, record-payment reporting a failed
  # allocation as allocated. Scoped to the paths where the consequence is money or a legal
  # obligation; a bare catch in a UI nicety is not worth a build failure.
  - id: no-swallowed-write
    languages: [typescript]
    severity: ERROR
    # Scoped to WRITES, and deliberately unfiltered by path.
    #
    # The first draft of this rule flagged any `catch {}` under the finance/quotes paths and hit
    # 43 sites. Reading all 43: every one was a documented, deliberate best-effort catch around a
    # READ (a logo download, a prior-balance lookup, a PDF embed, a fire-and-forget notification)
    # — semgrep counts a comment-only body as empty, so the rule could not tell `catch {}` from
    # `catch { /* logo optional */ }`. It was measuring syntax, not the defect.
    #
    # The defect is a swallowed WRITE. Re-scoped to that, the whole platform yielded 9 — and 7
    # were real: three lost `ai_usage_logs` billing rows (spend with no record), a lost ERGANI
    # submission audit row (no proof of a government filing), a lost `last_digest_at` stamp (the
    # double-notify guard failing open), a lost `embedding_status='failed'` write (doc stuck
    # forever), and a recovery cron whose counter incremented on a failed update.
    message: >
      Swallowed write (#309 item 6): this insert/update/delete sits inside a `try` whose `catch`
      does nothing, so a failed write is indistinguishable from a successful one and the code
      after it carries on as though the row exists. Best-effort is fine — INVISIBLE is not.
      Log the error (or rethrow). If the no-op is genuinely correct, say why in the catch body
      AND annotate with `// nosemgrep: no-swallowed-write`.
    patterns:
      - pattern-either:
          - pattern: $X.insert(...)
          - pattern: $X.update(...)
          - pattern: $X.upsert(...)
          - pattern: $X.delete(...)
      # This direction (match the write, require the empty-catch context) is the one that parses.
      # `try { ... $X.insert(...) ... } catch ($E) { }` is a TypeScript parse error in semgrep,
      # and a rule that fails to parse loads as a rule that matches NOTHING.
      - pattern-inside: 'try { ... } catch ($E) { }'

  - id: no-unchecked-supabase-write-in-money-path
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include:
        - "src/modules/finance/**"
        - "src/modules/quotes/**"
        - "supabase/functions/_shared/payments/**"
        - "supabase/functions/finance-*/**"
    message: >
      Unchecked write (#309 item 6): supabase-js resolves on an RLS denial instead of throwing,
      so destructuring only `data` means a rejected insert/update/delete looks identical to a
      successful one. Destructure `error` and act on it.
    # `{ data: $D }` also matches `{ data, error }` — verified against a probe, where it
    # flagged the CORRECT form. A rule that fires on correct code gets disabled within a day,
    # so the compliant shapes are excluded explicitly.
    patterns:
      - pattern-either:
          - pattern: 'const { data: $D } = await $Q.insert(...)'
          - pattern: 'const { data: $D } = await $Q.update(...)'
          - pattern: 'const { data: $D } = await $Q.upsert(...)'
          - pattern: 'const { data: $D } = await $Q.delete(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.insert(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.update(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.upsert(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.delete(...)'

  # ── #309 item 7 · Fail-open auth / entitlement / quota / credit gates ──────
  # One of the two cross-cutting root causes the audit named: fail-open is the house default.
  # A gate that returns "allowed" when it errors is not a gate. The instance that proves the
  # cost: real-estate-public's enforceLeadRateLimit was `catch { return null; }`, so the ONLY
  # brake on an unauthenticated cross-tenant CRM injection failed open under exactly the load
  # a flood would produce.
  - id: no-fail-open-in-gate
    # typescript ONLY. With `javascript` also declared, semgrep threw
    # "Invalid pattern for JavaScript: Stdlib.Parsing.Parse_error" on `catch (...)` and
    # rejected the WHOLE rule — it loaded and matched nothing. Caught by scanning a probe;
    # it would have looked like a clean codebase forever. `.ts`/`.tsx` are covered by
    # `typescript`, which is all this repo has.
    languages: [typescript]
    severity: ERROR
    # NO path filter, deliberately. The first draft scoped this to **/*auth*, **/*credit* etc.
    # and matched NOTHING — camelCase filenames like rateLimitProbe.ts fall outside those
    # globs, so the rule was inert. Measured platform-wide instead: this shape occurs ZERO
    # times across src/ and supabase/functions/ today, so there is no noise to scope away from
    # and the rule simply prevents it coming back anywhere.
    message: >
      Fail-open gate (#309 item 7): this catch returns a permissive value, so an error in the
      check GRANTS access instead of denying it. The instance that proves the cost:
      real-estate-public's enforceLeadRateLimit was `catch { return null; }`, so the only brake
      on an unauthenticated cross-tenant CRM injection failed open under exactly the load a
      flood would produce. Gates fail CLOSED. If failing open is a deliberate availability
      trade, say so in a comment and name the blast radius.
    pattern-either:
      # `catch ($E)` also matches a bare `catch {` — verified against a probe carrying both
      # forms, so listing the bare variant separately is redundant.
      #
      # `catch (...)` is a parse error in BOTH javascript and typescript. That is what made the
      # first draft of this rule load and silently match nothing: semgrep reports the rule as
      # broken but keeps scanning, so the run looks clean.
      - pattern: 'try { ... } catch ($E) { return true; }'
      - pattern: 'try { ... } catch ($E) { return {..., allowed: true}; }'
      - pattern: 'try { ... } catch ($E) { return {..., success: true}; }'
      - pattern: 'try { ... } catch ($E) { return {..., ok: true}; }'

  # ── K · Prompts come from the database (#347 phase 3P) ──────────────────────
  # A hardcoded prompt fallback is invisible when it fires. segmentation_service read the DB,
  # caught every exception, logged at DEBUG and used a 9,119-char constant: an admin editing that
  # prompt saw it save and changed nothing, forever, while every health signal stayed green.
  #
  # The Python side is guarded by tests/unit/test_prompts_come_from_the_database.py. The
  # TypeScript/edge side had NO guard at all until this rule, and that is where 22 of the 29
  # migrated prompts live.
  #
  # SPLIT BY LANGUAGE ON PURPOSE. A single rule declaring [typescript, python] threw
  # "Invalid pattern for TypeScript: Stdlib.Parsing.Parse_error" on the Python `or` form and
  # semgrep rejected the WHOLE rule — it loaded and matched nothing. Same failure as
  # no-fail-open-in-gate. Verified against a probe carrying 7 bad and 2 good shapes: 7/7 matched,
  # 0 false positives, 0 rule errors. Both shapes occur ZERO times in the tree today.
  - id: no-prompt-code-fallback
    languages: [typescript]
    severity: ERROR
    message: >
      Prompt fallback (#347 phase 3P): a prompt loader's result is OR'd with a literal, so a
      missing row silently substitutes a hardcoded prompt and the model gets a different document
      than the one in /admin/ai-configs. A missing prompt is a hard failure. Use
      loadPrompt/getToolPrompt (which throw), or tryLoadPrompt when absence is genuinely expected
      — it returns null only for PromptNotConfigured and still throws when the store is
      unreachable, so an outage can never look like "not configured".
    # `await` is not optional here: every real call site awaits, and a bare-call pattern matched
    # NOTHING against the probe.
    pattern-either:
      - pattern: await getToolPrompt(...) || "..."
      - pattern: await getToolPrompt(...) ?? "..."
      - pattern: await getAgentSystemPrompt(...) || "..."
      - pattern: await getAgentSystemPrompt(...) ?? "..."
      - pattern: await getGenerationPrompt(...) || "..."
      - pattern: await getGenerationPrompt(...) ?? "..."
      - pattern: await loadPrompt(...) || "..."
      - pattern: await loadPrompt(...) ?? "..."
      - pattern: await tryLoadPrompt(...) || "..."
      - pattern: await tryLoadPrompt(...) ?? "..."
      - pattern: getToolPrompt(...) || "..."
      - pattern: getGenerationPrompt(...) || "..."

  - id: no-prompt-code-fallback-python
    languages: [python]
    severity: ERROR
    message: >
      Prompt fallback (#347 phase 3P): `load_prompt(...) or "literal"` substitutes a hardcoded
      prompt when the row is missing. This is the shape that made
      `self._db_prompt or EXTRACTION_SYSTEM_PROMPT` run platform defaults for any workspace whose
      prompt failed to load, silently. A missing prompt must raise.
    pattern-either:
      - pattern: await load_prompt(...) or "..."
      - pattern: load_prompt(...) or "..."
      - pattern: get_cached(...) or "..."

  # `getGenerationPrompt` took a REQUIRED third `fallback` argument until #347 phase 3P. That is
  # what made every caller carry a copy of its own prompt, and the copy won silently whenever the
  # lookup missed — which for 'ai_rerank' was every single call, because that prompt is filed
  # under prompt_type='tool' and the loader queried 'generation'. Re-adding the parameter would
  # reintroduce the whole class, so the arity is pinned here.
  - id: no-generation-prompt-fallback-arg
    languages: [typescript]
    severity: ERROR
    message: >
      Prompt fallback (#347 phase 3P): getGenerationPrompt takes (supabase, promptName) only.
      A third argument is the removed `fallback` parameter, which made a missed lookup
      indistinguishable from a configured prompt.
    pattern: getGenerationPrompt($A, $B, $C)

  # ── K · Dates of record computed in UTC (#366 BU-1) ────────────────────────
  # `new Date().toISOString().slice(0, 10)` is the UTC calendar date, not the operator's. This
  # platform serves Greek customers (UTC+2/+3), so between local midnight and 02:00–03:00 every
  # one of these returned YESTERDAY — on the invoice issue date (a fiscal record submitted to
  # AADE via myDATA, numbered sequentially BY DATE), on `paidAt` (feeds get_order_settlements),
  # and on attendance dates (payroll). It was written by hand at 25 sites because there was no
  # helper to reach for; there is one now.
  #
  # Frontend only. `src/**` runs in the operator's browser, where "today" means their calendar
  # day. Edge functions and MIVAA run in UTC by definition and have no workspace timezone to
  # resolve against — a rule there would be noise, not a finding.
  #
  # Deliberately narrow: only the `new Date()` / `Date.now() ± n` shapes, which can have no other
  # intent. `d.toISOString().slice(0, 10)` on a variable is left alone — `projects/lib/schedule.ts`
  # and `financeService.nextRecurrenceDate` do all their arithmetic in UTC and are self-consistent,
  # and `ordersService` matches the DB aging view's UTC session on purpose.
  - id: no-utc-today-as-local-date
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      Date of record (#366 BU-1): toISOString() renders the UTC calendar date, which is
      YESTERDAY for a UTC+2/+3 operator between local midnight and 02:00–03:00. Use
      `todayLocalISO()` / `toLocalISODate(d)` / `localISODateOffset(n)` from `@/utils/datetime`.
    paths:
      include:
        - "/src/**"
      exclude:
        - "/src/utils/datetime.ts"
    pattern-either:
      - pattern: new Date().toISOString().slice(0, 10)
      - pattern: new Date().toISOString().substring(0, 10)
      - pattern: new Date().toISOString().split('T')[0]
      - pattern: new Date().toISOString().split("T")[0]
      - pattern: new Date(Date.now() + $N).toISOString().slice(0, 10)
      - pattern: new Date(Date.now() - $N).toISOString().slice(0, 10)
      - pattern: new Date(Date.now() + $N).toISOString().split('T')[0]
      - pattern: new Date(Date.now() - $N).toISOString().split('T')[0]

  # ── SSRF · unguarded server-side DOWNLOAD from a URL we did not choose (invariant 7) ──
  #
  # This class has now been found NINE times across two repos in FOUR different implementations
  # (#363 `EE-4`): the catalog PDF and quote image paths, MIVAA's aiohttp downloader, Pinterest
  # import, the moodboard sheet renderer, tenant webhooks, the flow-engine HTTP action, the
  # purchase-sheet PDF, and the AI client's own image ingestion. Every one looked correct in
  # isolation, because a fetch that returns bytes looks the same whether the host was checked
  # or not.
  #
  # The rule is scoped to DOWNLOADS — a fetch whose body is read as bytes — and that scoping is
  # what makes it usable. Matching "fetch a variable" instead flags all 253 fetches in this
  # tree, overwhelmingly polls and POSTs against fixed provider endpoints held in a constant,
  # and a rule with a 22-in-23 false-positive rate gets annotated into silence. Reading bytes
  # back is the actual defect shape: it is where the response body is unbounded, and it is what
  # every one of the nine sites was doing.
  #
  # `assertSafeUrl` is a sanitizer, so guarding the URL first clears the finding — which is why
  # the correctly-guarded sites (generate-vr-world, pinterest-api, workspace-webhook-dispatcher)
  # do not fire and did not need annotating.
  #
  # The fix is `fetchImageGuarded` / `fetchBinaryGuarded` from `_shared/fetch-image.ts`, which
  # also caps the read; `assertSafeUrl` + `redirect: 'error'` is the minimum.
  - id: no-unguarded-download-of-user-url
    languages: [typescript, javascript]
    severity: ERROR
    mode: taint
    message: >
      SSRF (invariant 7, #363 EE-4): server-side download from a URL this runtime did not
      choose. A bare fetch() follows redirects into link-local/private space and
      arrayBuffer()/blob() reads an unbounded body into a 256 MB isolate. Use
      `fetchImageGuarded` / `fetchBinaryGuarded` from `_shared/fetch-image.ts`, or call
      `assertSafeUrl()` from `_shared/ssrf-guard.ts` first and pass `redirect: 'error'`.
    paths:
      include:
        - "supabase/functions/**"
      exclude:
        - "supabase/functions/_shared/fetch-image.ts"
        - "supabase/functions/_shared/ssrf-guard.ts"
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: await fetch($URL)
              - pattern: await fetch($URL, ...)
          - metavariable-regex:
              metavariable: $URL
              # Bare identifiers (`imageUrl`) AND member accesses on a row
              # (`it.design_image_url`, `webhook.url`, `job.source_url`). Only the bare form was
              # matched, which is why this rule stayed silent on #361 `EG-18` — a raw
              # `fetch(it.design_image_url)` in generate-purchase-sheet-pdf — and on the two
              # further sites the same sweep then found in notification-dispatcher and
              # scheduled-import-runner. A URL arriving on a database row is MORE
              # attacker-influenced than a local, not less: it was written there by a supplier
              # feed, an agent tool, or a tenant's settings form.
              # The `.` lives inside the character class rather than in a repeated
              # `(?:\.name)*` group on purpose: with the group, `webhook.url` cannot match,
              # because the group consumes the `u` of `url` and leaves the suffix nothing.
              regex: ^[A-Za-z_$][A-Za-z0-9_$.]*(?:[Uu][Rr][LlIi]|[Hh][Rr][Ee][Ff]|[Ss][Rr][Cc])$
          # Exempt the URL that came OUT of the guard. This has to be expressed on the source
          # rather than as a `pattern-sanitizer`, because the tainted value here is the RESPONSE
          # — sanitizing the url would never touch it. Binding the same $URL metavariable makes
          # the exemption exact: it clears `safeUrl = await assertSafeUrl(x); fetch(safeUrl)`
          # and nothing else, not merely "a file that mentions assertSafeUrl somewhere".
          - pattern-not-inside: |
              $URL = await assertSafeUrl(...)
              ...
          - pattern-not-inside: |
              const $URL = await assertSafeUrl(...)
              ...
    pattern-sinks:
      - pattern-either:
          - pattern: $RES.arrayBuffer()
          - pattern: $RES.blob()
          # `.text()` is deliberately NOT a sink, and it was tried. It is the same unbounded
          # read with a different return type, so on paper it belongs here — but measured
          # against this codebase it produced 8 findings and every one was a false positive:
          # our own Sentry DSN, our own MIVAA and Python backend URLs, storage signed URLs we
          # minted a line earlier, a fixed pinterest.com oembed endpoint, an upload URL from a
          # provider's authenticated reply. Almost everything that reads `.text()` is reading a
          # response to a call we chose to make. Eight permanent suppressions in a blocking
          # ruleset that currently sits at zero findings is a worse instrument than the rule
          # not covering that half — suppressions are where real findings go to hide.
          # The `.text()` shape is covered instead by the stored-URL sweep in
          # tests/unit/imageFetchGuard.test.ts, which keys on where the URL came FROM and so
          # distinguishes `job.source_url` from `sentryUrl` without needing an exemption list.
