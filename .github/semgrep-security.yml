# Semgrep security ruleset — enforces the CLAUDE.md "Security Invariants" (pentest #250)
# at PR time so the classes we fixed can't silently regress. High-signal / low-false-
# positive rules only; run via .github/workflows/semgrep.yml.
rules:
  # ── J · XSS / output encoding (invariant 11) ────────────────────────────────
  - id: no-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      XSS (#250 J / invariant 11): dangerouslySetInnerHTML renders raw HTML. Use JSX or
      react-markdown (WITHOUT rehype-raw), or escape with the esc() helper.
    # `dangerouslySetInnerHTML={=~/.*/}` (the original) matches NOTHING — verified against a
    # probe component. It has to be anchored to the JSX element, in both the self-closing and
    # with-children forms, with `...` around it so other props don't defeat the match.
    pattern-either:
      - pattern: <$EL ... dangerouslySetInnerHTML={...} ... />
      - pattern: <$EL ... dangerouslySetInnerHTML={...} ...>...</$EL>

  - id: no-document-write
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      XSS (#250 J1): document.write() with app/user content runs in the page origin and
      can steal the Supabase session. Build DOM safely or escape via esc().
    pattern: document.write(...)

  - id: no-rehype-raw
    languages: [typescript, javascript]
    severity: ERROR
    message: "XSS (#250 J / invariant 11): rehype-raw renders raw HTML from markdown — do not use."
    pattern-either:
      - pattern: require('rehype-raw')
      - pattern: import 'rehype-raw'
      - pattern: import $X from 'rehype-raw'

  # Invariant 11 says "do NOT hand-roll a local copy — the old per-file copies drifted to 3
  # different strengths", but nothing enforced that half of it: the three rules above cover how
  # HTML is RENDERED, none covered how it is ESCAPED. A fourth copy had duly reappeared in
  # _shared/react-email-renderer.ts. It escaped the full set, so it was not a hole — which is the
  # point: a drifted copy is only dangerous later, and by then nobody re-reads it.
  - id: no-local-escape-html
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      XSS (invariant 11): hand-rolled HTML escaper. Import `escapeHtml` from
      `_shared/html.ts` (edge) or `@/utils/escapeHtml` (frontend) — both escape the full
      & < > " ' set and are attribute-safe. Local copies drift.
    paths:
      exclude:
        - "src/utils/escapeHtml.ts"
        - "supabase/functions/_shared/html.ts"
        # Third canonical twin: the Vercel Node functions in api/ are plain ESM .js with no
        # `@/` alias and no TS step, so they can import neither of the two above. Parity of all
        # three is enforced by tests/unit/escapeHtmlParity.test.ts, not by convention.
        - "api/_shared/html.js"
    pattern-either:
      - pattern: function escapeHtml(...) { ... }
      - pattern: const escapeHtml = (...) => { ... }
      - pattern: const escapeHtml = function (...) { ... }

  # ── A · Auth (invariant 1/5) ────────────────────────────────────────────────
  - id: no-jwt-verification-disabled
    languages: [python]
    severity: ERROR
    message: "Auth bypass (#250 A5): JWT decoded with audience/signature verification disabled."
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_aud": False, ...}, ...)'
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'

  # ── G / BOPLA · Mass assignment (invariant 8) ───────────────────────────────
  - id: no-mass-assignment-db-insert
    languages: [python]
    severity: WARNING
    message: >
      Mass-assignment (#250 G / invariant 8): don't spread a request model into a DB write
      — a caller can set trust/identity fields (workspace_id, user_id, role, price). Build
      an allowlisted payload instead.
    pattern-either:
      - pattern: $T.insert($REQ.dict())
      - pattern: $T.insert($REQ.model_dump())
      - pattern: $T.insert(**$REQ.dict())
      - pattern: $T.insert(**$REQ.model_dump())

  # ── #322 · Mass assignment from a STORED payload (invariant 8, TS side) ─────
  # The Python rule above catches a request body spread into a write. The template engine
  # introduced the same hazard from a different direction: `entity_templates.payload` is jsonb
  # read back out of the database, i.e. input that was untrusted when it went in and is untrusted
  # when it comes out. `.insert({ ...payload })` would let any key that ever landed in that column
  # become a column value — workspace_id, price, is_verified. Every adapter must build an explicit
  # object literal. (tests/unit/templateRegistry.test.ts asserts the same thing over adapters.ts;
  # this rule covers every OTHER file that grows a materializer later.)
  - id: no-mass-assignment-from-stored-payload
    languages: [typescript]
    severity: ERROR
    message: >
      Mass-assignment (#322 / invariant 8): a stored jsonb payload is untrusted input — never
      spread it into a DB write. Build an allowlisted object literal, field by field.
    pattern-either:
      - pattern: $T.insert({..., ...$P.payload, ...})
      - pattern: $T.insert({..., ...payload, ...})
      - pattern: $T.update({..., ...$P.payload, ...})
      - pattern: $T.update({..., ...payload, ...})

  # ── #309 item 6 · Swallowed failure in money / payment paths ───────────────
  # 7 of the 8 swallowed-failure findings across the whole audit were ONE shape: a bare
  # `catch {}` (or a discarded `error`) followed by an unconditional success toast. The user is
  # told the money moved and it did not — PosPage "Receipt issued" with no payments row,
  # real-estate-public "Thanks, we'll be in touch" on a lead never saved, email-unsubscribe
  # "You're unsubscribed" on an opt-out Postgres rejected, record-payment reporting a failed
  # allocation as allocated. Scoped to the paths where the consequence is money or a legal
  # obligation; a bare catch in a UI nicety is not worth a build failure.
  - id: no-swallowed-write
    languages: [typescript]
    severity: ERROR
    # Scoped to WRITES, and deliberately unfiltered by path.
    #
    # The first draft of this rule flagged any `catch {}` under the finance/quotes paths and hit
    # 43 sites. Reading all 43: every one was a documented, deliberate best-effort catch around a
    # READ (a logo download, a prior-balance lookup, a PDF embed, a fire-and-forget notification)
    # — semgrep counts a comment-only body as empty, so the rule could not tell `catch {}` from
    # `catch { /* logo optional */ }`. It was measuring syntax, not the defect.
    #
    # The defect is a swallowed WRITE. Re-scoped to that, the whole platform yielded 9 — and 7
    # were real: three lost `ai_usage_logs` billing rows (spend with no record), a lost ERGANI
    # submission audit row (no proof of a government filing), a lost `last_digest_at` stamp (the
    # double-notify guard failing open), a lost `embedding_status='failed'` write (doc stuck
    # forever), and a recovery cron whose counter incremented on a failed update.
    message: >
      Swallowed write (#309 item 6): this insert/update/delete sits inside a `try` whose `catch`
      does nothing, so a failed write is indistinguishable from a successful one and the code
      after it carries on as though the row exists. Best-effort is fine — INVISIBLE is not.
      Log the error (or rethrow). If the no-op is genuinely correct, say why in the catch body
      AND annotate with `// nosemgrep: no-swallowed-write`.
    patterns:
      - pattern-either:
          - pattern: $X.insert(...)
          - pattern: $X.update(...)
          - pattern: $X.upsert(...)
          - pattern: $X.delete(...)
      # This direction (match the write, require the empty-catch context) is the one that parses.
      # `try { ... $X.insert(...) ... } catch ($E) { }` is a TypeScript parse error in semgrep,
      # and a rule that fails to parse loads as a rule that matches NOTHING.
      - pattern-inside: 'try { ... } catch ($E) { }'

  - id: no-unchecked-supabase-write-in-money-path
    languages: [typescript, javascript]
    severity: ERROR
    paths:
      include:
        - "src/modules/finance/**"
        - "src/modules/quotes/**"
        - "supabase/functions/_shared/payments/**"
        - "supabase/functions/finance-*/**"
    message: >
      Unchecked write (#309 item 6): supabase-js resolves on an RLS denial instead of throwing,
      so destructuring only `data` means a rejected insert/update/delete looks identical to a
      successful one. Destructure `error` and act on it.
    # `{ data: $D }` also matches `{ data, error }` — verified against a probe, where it
    # flagged the CORRECT form. A rule that fires on correct code gets disabled within a day,
    # so the compliant shapes are excluded explicitly.
    patterns:
      - pattern-either:
          - pattern: 'const { data: $D } = await $Q.insert(...)'
          - pattern: 'const { data: $D } = await $Q.update(...)'
          - pattern: 'const { data: $D } = await $Q.upsert(...)'
          - pattern: 'const { data: $D } = await $Q.delete(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.insert(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.update(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.upsert(...)'
      - pattern-not: 'const { ..., error: $E } = await $Q.delete(...)'

  # ── #309 item 7 · Fail-open auth / entitlement / quota / credit gates ──────
  # One of the two cross-cutting root causes the audit named: fail-open is the house default.
  # A gate that returns "allowed" when it errors is not a gate. The instance that proves the
  # cost: real-estate-public's enforceLeadRateLimit was `catch { return null; }`, so the ONLY
  # brake on an unauthenticated cross-tenant CRM injection failed open under exactly the load
  # a flood would produce.
  - id: no-fail-open-in-gate
    # typescript ONLY. With `javascript` also declared, semgrep threw
    # "Invalid pattern for JavaScript: Stdlib.Parsing.Parse_error" on `catch (...)` and
    # rejected the WHOLE rule — it loaded and matched nothing. Caught by scanning a probe;
    # it would have looked like a clean codebase forever. `.ts`/`.tsx` are covered by
    # `typescript`, which is all this repo has.
    languages: [typescript]
    severity: ERROR
    # NO path filter, deliberately. The first draft scoped this to **/*auth*, **/*credit* etc.
    # and matched NOTHING — camelCase filenames like rateLimitProbe.ts fall outside those
    # globs, so the rule was inert. Measured platform-wide instead: this shape occurs ZERO
    # times across src/ and supabase/functions/ today, so there is no noise to scope away from
    # and the rule simply prevents it coming back anywhere.
    message: >
      Fail-open gate (#309 item 7): this catch returns a permissive value, so an error in the
      check GRANTS access instead of denying it. The instance that proves the cost:
      real-estate-public's enforceLeadRateLimit was `catch { return null; }`, so the only brake
      on an unauthenticated cross-tenant CRM injection failed open under exactly the load a
      flood would produce. Gates fail CLOSED. If failing open is a deliberate availability
      trade, say so in a comment and name the blast radius.
    pattern-either:
      # `catch ($E)` also matches a bare `catch {` — verified against a probe carrying both
      # forms, so listing the bare variant separately is redundant.
      #
      # `catch (...)` is a parse error in BOTH javascript and typescript. That is what made the
      # first draft of this rule load and silently match nothing: semgrep reports the rule as
      # broken but keeps scanning, so the run looks clean.
      - pattern: 'try { ... } catch ($E) { return true; }'
      - pattern: 'try { ... } catch ($E) { return {..., allowed: true}; }'
      - pattern: 'try { ... } catch ($E) { return {..., success: true}; }'
      - pattern: 'try { ... } catch ($E) { return {..., ok: true}; }'
