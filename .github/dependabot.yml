version: 2

updates:
  # Frontend — npm (src/, root package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    groups:
      # Batch minor/patch updates into single PRs per group
      react-ecosystem:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      supabase:
        patterns:
          - "@supabase/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      shadcn-deps:
        patterns:
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "tailwindcss*"
          - "lucide-react"
      ai-sdks:
        patterns:
          - "@anthropic-ai/*"
          - "openai"
      three-js:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "@sparkjsdev/*"
      dev-tooling:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript*"
          - "eslint*"
          - "@typescript-eslint/*"
          - "@types/*"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Don't auto-bump major versions — review those manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend — pip (mivaa-pdf-extractor/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/mivaa-pdf-extractor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Athens"
    open-pull-requests-limit: 10
    groups:
      fastapi-stack:
        patterns:
          - "fastapi*"
          - "uvicorn*"
          - "pydantic*"
          - "starlette*"
      ai-clients:
        patterns:
          - "openai"
          - "anthropic"
          - "voyageai"
          - "huggingface-hub"
      scientific:
        patterns:
          - "numpy"
          - "scipy"
          - "scikit-learn"
          - "scikit-image"
          - "Pillow"
          - "opencv-python-headless"
          - "imageio"
          - "imagehash"
      pdf-processing:
        patterns:
          - "pymupdf4llm"
          - "PyMuPDF"
          - "pypdf"
          - "pdfplumber"
          - "pandas"
      http-clients:
        patterns:
          - "httpx"
          - "requests"
          - "aiohttp"
      nlp:
        patterns:
          - "nltk"
          - "easyocr"
          - "pytesseract"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
